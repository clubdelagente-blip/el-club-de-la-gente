<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <script src="https://js.sentry-cdn.com/c008db963bd16390827cbba643292144.min.js" crossorigin="anonymous"></script>
  <script async src="https://www.googletagmanager.com/gtag/js?id=G-K062DHDKP"></script>
  <script>window.dataLayer=window.dataLayer||[];function gtag(){dataLayer.push(arguments);}gtag('js',new Date());gtag('config','G-K062DHDKP');</script>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>El Club de la Gente — Verificar membresía</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Anton&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --verde: #095544;
      --verde-claro: #E3F7EE;
      --rojo: #c0392b;
      --rojo-claro: #fdecea;
      --crema: #F1F7F6;
      --tinta: #021B1A;
      --tinta-40: rgba(2,27,26,.4);
      --display: 'Anton', sans-serif;
      --sans: 'Inter', sans-serif;
    }
    body {
      font-family: var(--sans);
      background: var(--crema);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }

    /* Logo */
    .logo {
      display: flex; align-items: center; gap: 12px;
      text-decoration: none; color: var(--tinta);
      margin-bottom: 40px;
    }
    .logo__mark svg { width: 38px; height: 38px; display: block; }
    .logo__type { display: flex; flex-direction: column; line-height: 1.1; }
    .logo__type .l1 { font-family: var(--display); font-size: 10px; letter-spacing: .25em; text-transform: uppercase; }
    .logo__type span:not(.l1) { font-family: var(--display); font-size: 14px; font-weight: 600; }

    /* Card */
    .card {
      background: #fff;
      border-radius: 20px;
      padding: 40px 32px;
      width: 100%;
      max-width: 400px;
      text-align: center;
      box-shadow: 0 2px 32px rgba(0,0,0,.07);
    }

    /* Estado activo */
    .estado-ic {
      width: 72px; height: 72px;
      border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
      margin: 0 auto 20px;
      font-size: 32px;
    }
    .estado-ic--ok { background: var(--verde-claro); }
    .estado-ic--no { background: var(--rojo-claro); }

    .estado-lbl {
      font-size: 11px; font-weight: 700; letter-spacing: .15em;
      text-transform: uppercase; margin-bottom: 8px;
    }
    .estado-lbl--ok { color: var(--verde); }
    .estado-lbl--no { color: var(--rojo); }

    .miembro-nombre {
      font-family: var(--display);
      font-size: 32px; font-weight: 700;
      line-height: 1.1;
      margin-bottom: 6px;
    }
    .miembro-tipo {
      font-size: 13px; color: var(--tinta-40);
      margin-bottom: 28px;
    }

    .divider { border: none; border-top: 1px solid #ebebeb; margin: 20px 0; }

    .detalle { display: flex; justify-content: space-between; align-items: center; padding: 6px 0; }
    .detalle__lbl { font-size: 12px; color: var(--tinta-40); }
    .detalle__val { font-size: 13px; font-weight: 600; }

    .badge {
      display: inline-flex; align-items: center; gap: 6px;
      padding: 5px 14px; border-radius: 99px;
      font-size: 12px; font-weight: 700; letter-spacing: .05em;
    }
    .badge--ok { background: var(--verde-claro); color: var(--verde); }
    .badge--no { background: var(--rojo-claro); color: var(--rojo); }
    .badge .dot { width: 7px; height: 7px; border-radius: 50%; background: currentColor; }

    .footer-note {
      margin-top: 28px;
      font-size: 11px; color: var(--tinta-40);
      line-height: 1.5;
    }

    .estado-ic--lim { background: #fef3c7; }
    .estado-lbl--lim { color: #b45309; }
    .badge--lim { background: #fef3c7; color: #b45309; }

    /* Loading / Error */
    .loading { font-size: 14px; color: var(--tinta-40); text-align: center; }
    .error-msg { color: var(--rojo); font-size: 14px; font-weight: 600; text-align: center; }
  </style>
</head>
<body>

  <a class="logo" href="El Club de la Gente.html">
    <img src="logo-club.png" alt="El Club de la Gente" style="height:38px;width:auto;">
  </a>

  <div class="card" id="card">
    <p class="loading">Verificando membresía...</p>
  </div>

  <p class="footer-note" style="max-width:360px;text-align:center;margin-top:20px">
    Esta verificación es en tiempo real. Si el estado es <strong>Activo</strong>, el miembro tiene derecho al descuento correspondiente.
  </p>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
  <script>
    const { createClient } = supabase;
    const _supabase = createClient(
      "https://egwaedadpqfwnbfosiao.supabase.co",
      "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImVnd2FlZGFkcHFmd25iZm9zaWFvIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODA3Njc2ODcsImV4cCI6MjA5NjM0MzY4N30.NrBPX8HhTcs_y-QG3o_GoEAednFc0TqUunkQe1dblT4"
    );
    (async () => {

    const card = document.getElementById("card");
    const params = new URLSearchParams(location.search);
    const id = params.get("id");
    const supabaseClient = _supabase;

    // Plantillas de WhatsApp aprobadas por Meta -- fuera del Sandbox ya no
    // se puede mandar texto libre a un número que no escribió primero.
    const CONTENT_SID_DESCUENTO_CONFIRMADO_PROFESIONAL = "HX5a6baa832cf328403b9c6eb5affe1f08";
    const CONTENT_SID_DESCUENTO_CONFIRMADO_PCT = "HX97ddfc6468b5751748cb2b1abef30147";
    const CONTENT_SID_DESCUENTO_CONFIRMADO_BENEFICIO = "HX0cd6a44f46a89233ea800c9513a48029";

    // El aliado se identifica una sola vez por dispositivo con el código de su
    // negocio (el mismo que ya se usa en Directorio.html) y queda guardado en
    // este teléfono/tablet -- antes bastaba con elegir cualquier nombre de una
    // lista sin ningún código, así que cualquiera podía "ser" cualquier aliado.
    let aliadoId = "", aliadoCodigo = "";
    try {
      const guardado = JSON.parse(localStorage.getItem("ecdlg_aliado_auth") || "null");
      if (guardado?.id && guardado?.codigo) { aliadoId = guardado.id; aliadoCodigo = guardado.codigo; }
    } catch (_) {}
    const aliadoIdSugerido = params.get("aliado") || "";

    const btnStyle = (bg, color="#fff") => `display:block;width:100%;padding:14px;background:${bg};color:${color};border-radius:12px;text-align:center;text-decoration:none;font-family:'Inter',sans-serif;font-size:14px;font-weight:600;margin-top:8px;letter-spacing:.02em;border:none;cursor:pointer;`;

    function conTimeout(promesa, ms) {
      return Promise.race([
        promesa,
        new Promise((_, reject) => setTimeout(() => reject(new Error("timeout")), ms)),
      ]);
    }

    function discountRow(aliadoInfo) {
      if (!aliadoInfo) return "";
      return `<div class="detalle"><span class="detalle__lbl">Descuento en ${aliadoInfo.nombre}</span><span class="detalle__val" style="color:var(--verde);font-weight:700">${aliadoInfo.descuento || "—"}</span></div>`;
    }

    function sellosRow(aliadoInfo, sellosActuales) {
      if (!aliadoInfo?.sellos_activo) return "";
      const meta = aliadoInfo.sellos_meta || 10;
      if (sellosActuales >= meta) {
        const premio = aliadoInfo.sellos_premio_desc || (aliadoInfo.sellos_premio_tipo === "gratis" ? "Gratis" : "Descuento");
        return `
          <div style="background:#fef9e7;border-radius:10px;padding:14px;margin:10px 0;text-align:left">
            <div style="font-weight:700;color:#b45309;margin-bottom:4px">🎉 ¡Completó su tarjeta de sellos!</div>
            <div style="font-size:12px;color:#888;margin-bottom:10px">Premio: ${premio}</div>
            <button id="btn-confirmar-canje" style="${btnStyle("#095544")}">Confirmar canje</button>
          </div>`;
      }
      return `<div class="detalle"><span class="detalle__lbl">Sellos en ${aliadoInfo.nombre}</span><span class="detalle__val" style="color:var(--verde);font-weight:700">${sellosActuales}/${meta}</span></div>`;
    }

    // Misma lógica de "tiene cortesía de cumpleaños en este aliado" que ya
    // usan avisar-cumpleanos.ts y MisCortesias.html -- acá se muestra para
    // que el aliado verifique identidad + cumpleaños en un solo paso (antes
    // el miembro solo se lo decía por WhatsApp, sin ningún control real).
    function cumpleRow(aliadoInfo) {
      if (!aliadoInfo?.cortesiaCumple) return "";
      return `
        <div style="background:#fef9e7;border-radius:10px;padding:14px;margin:10px 0;text-align:left">
          <div style="font-weight:700;color:#b45309;margin-bottom:4px">🎂 ¡Hoy es su cumpleaños!</div>
          <div style="font-size:12px;color:#888">Cortesía: ${aliadoInfo.cortesiaCumple}</div>
        </div>`;
    }

    function bindBtnConfirmarCanje(aliadoInfo) {
      document.getElementById("btn-confirmar-canje")?.addEventListener("click", async (e) => {
        const btn = e.target;
        btn.disabled = true; btn.textContent = "Confirmando...";
        const { data, error } = await supabaseClient.rpc("confirmar_canje_sellos", {
          p_miembro_id: id, p_aliado_id: aliadoInfo.id, p_codigo: aliadoCodigo,
        });
        if (error || !data?.ok) { btn.disabled = false; btn.textContent = "Confirmar canje"; return; }
        cargarYRenderizar();
      });
    }

    // Reemplaza el selector libre de "elige tu negocio de una lista" por el
    // código del negocio (el mismo de 4 dígitos que ya usa Directorio.html) --
    // así Verificar.html deja de confiar en que quien abre la página de verdad
    // trabaja en el negocio que dice ser.
    function selectorAliadoHtml() {
      return `
        <hr class="divider">
        <p style="font-size:12px;color:#888;margin-bottom:10px;text-align:left">¿Cuál es tu negocio? Escribe su código para ver el % de descuento a aplicar (se guarda en este dispositivo, no hace falta repetirlo).</p>
        <input id="in-aliado-codigo" type="text" inputmode="numeric" placeholder="Código del negocio" autocomplete="off"
          style="width:100%;padding:10px 12px;border:1px solid #ebebeb;border-radius:10px;font-size:14px;margin-bottom:8px;text-align:center;letter-spacing:.1em">
        <p id="aliado-codigo-error" class="error-msg" style="display:none;margin-bottom:8px">Código incorrecto.</p>
        <button id="btn-guardar-aliado" style="${btnStyle('#095544')}">Guardar</button>
      `;
    }

    function bindSelectorAliado(recargar) {
      const input = document.getElementById("in-aliado-codigo");
      if (aliadoIdSugerido) input?.focus();
      document.getElementById("btn-guardar-aliado")?.addEventListener("click", async () => {
        const codigo = (input?.value || "").trim();
        const err = document.getElementById("aliado-codigo-error");
        if (!codigo) return;
        const btn = document.getElementById("btn-guardar-aliado");
        btn.disabled = true; btn.textContent = "Verificando...";
        const { data, error } = await supabaseClient.rpc("resolver_aliado_por_codigo", { p_codigo: codigo });
        const encontrado = Array.isArray(data) ? data[0] : data;
        if (error || !encontrado?.id) {
          btn.disabled = false; btn.textContent = "Guardar";
          if (err) err.style.display = "block";
          return;
        }
        localStorage.setItem("ecdlg_aliado_auth", JSON.stringify({ id: encontrado.id, codigo }));
        aliadoId = encontrado.id; aliadoCodigo = codigo;
        recargar();
      });
    }

    const PLAN_NOMBRE = { gratis: "Gratis", basica: "Básico", premium: "Premium", vitalicia: "Vitalicia" };
    const LIMITE_DESCUENTOS = { gratis: 0, basica: 2, premium: Infinity, vitalicia: Infinity };

    function renderOk(p, usos, limite, aliadoInfo, sellosActuales) {
      const rolLabel = { miembro: "Miembro", aliado: "Aliado comercial", profesional: "Profesional" }[p.rol] || "Miembro";
      const planNombre = PLAN_NOMBRE[p.plan] || "Básico";
      const planLabel = limite === Infinity ? `${planNombre} · Ilimitado` : `${planNombre} · ${usos}/${limite} usos este mes`;
      const dirUrl = `Directorio.html?miembro=${id}&wa=${encodeURIComponent(p.whatsapp||"")}&plan=${p.plan||"basica"}&usos=${usos}`;
      card.innerHTML = `
        <div class="estado-ic estado-ic--ok">✓</div>
        <div class="estado-lbl estado-lbl--ok">Membresía activa</div>
        <div class="miembro-nombre">${p.nombre}</div>
        <div class="miembro-tipo">${rolLabel} · El Club de la Gente</div>
        <hr class="divider">
        <div class="detalle"><span class="detalle__lbl">Estado</span><span class="badge badge--ok"><span class="dot"></span> Activo</span></div>
        <div class="detalle"><span class="detalle__lbl">Plan</span><span class="detalle__val">${planLabel}</span></div>
        ${discountRow(aliadoInfo)}
        ${cumpleRow(aliadoInfo)}
        ${sellosRow(aliadoInfo, sellosActuales)}
        <div class="detalle"><span class="detalle__lbl">Verificado</span><span class="detalle__val">${new Date().toLocaleString("es-CO",{day:"numeric",month:"short",hour:"2-digit",minute:"2-digit"})}</span></div>
        <hr class="divider">
        ${promosAplicables(aliadoInfo).length ? `<button id="btn-aplicar-aliado" style="${btnStyle("#095544")}">🏷️ Aplicar descuento en ${aliadoInfo.nombre}</button>` : ""}
        <a href="${dirUrl}" style="${btnStyle(promosAplicables(aliadoInfo).length ? "#EAF3EF" : "#095544", promosAplicables(aliadoInfo).length ? "#021B1A" : "#fff")}">Ver aliados y descuentos &rarr;</a>
        <button id="btn-uber" style="${btnStyle("#021B1A")}">🚗 Aplicar descuento Uber</button>
        ${esPremium(p) ? `<button id="btn-prof" style="${btnStyle("#021B1A")}">💼 Aplicar servicio profesional</button>` : ""}
        ${!aliadoInfo ? selectorAliadoHtml() : ""}
      `;
      bindSelectorAliado(() => cargarYRenderizar());
      bindBtnUber(p);
      bindBtnProfesional(p);
      bindBtnConfirmarCanje(aliadoInfo);
      bindBtnAplicarAliado(p, aliadoInfo);
    }

    function renderLimite(p, limite, aliadoInfo, sellosActuales) {
      const planNombre = PLAN_NOMBRE[p.plan] || "Básico";
      const wa = (p.whatsapp||"").replace(/\D/g,"");
      const numero = wa.startsWith("57") ? wa : "57"+wa;
      const sinAcceso = limite === 0;
      const estadoLbl = sinAcceso ? "Sin acceso a descuentos de aliados" : "Límite mensual alcanzado";
      const estadoDetalle = sinAcceso ? "No incluido en Gratis" : `${limite} de ${limite} este mes`;
      const parrafo = sinAcceso
        ? "Los descuentos de aliados son exclusivos desde el plan Básico en adelante. El plan Gratis sí incluye Uber y la Tienda del Club."
        : `Este miembro usó su${limite!==1?"s":""} ${limite} descuento${limite!==1?"s":""} del mes. No aplica más descuentos hasta el próximo mes.`;
      const msg = sinAcceso
        ? `¡Hola ${p.nombre}! 👋 Los descuentos de aliados son exclusivos desde el plan Básico.\n\nActualiza tu membresía y aprovecha el Club sin restricciones.\n\nEl Club de la Gente`
        : `¡Hola ${p.nombre}! 👋 Llegaste al límite de ${limite} descuento${limite!==1?"s":""} del mes con tu membresía ${planNombre}.\n\n¿Quieres descuentos ilimitados? Actualiza a Premium por solo $20.000/mes y aprovecha el Club sin restricciones.\n\nEl Club de la Gente`;
      const waUrl = `https://wa.me/${numero}?text=${encodeURIComponent(msg)}`;
      card.innerHTML = `
        <div class="estado-ic estado-ic--lim">⚠</div>
        <div class="estado-lbl estado-lbl--lim">${estadoLbl}</div>
        <div class="miembro-nombre">${p.nombre}</div>
        <div class="miembro-tipo">Membresía ${planNombre} · El Club de la Gente</div>
        <hr class="divider">
        <div class="detalle"><span class="detalle__lbl">Estado</span><span class="badge badge--lim"><span class="dot"></span> ${sinAcceso ? "No incluido" : `Límite ${limite}/${limite}`}</span></div>
        <div class="detalle"><span class="detalle__lbl">Descuentos usados</span><span class="detalle__val">${estadoDetalle}</span></div>
        ${discountRow(aliadoInfo)}
        ${cumpleRow(aliadoInfo)}
        ${sellosRow(aliadoInfo, sellosActuales)}
        <hr class="divider">
        <p style="font-size:13px;color:#888;margin-bottom:12px;line-height:1.5">${parrafo}</p>
        <a href="Planes.html" style="${btnStyle("#095544")}">${sinAcceso ? "Ver membresías" : "Actualizar a Premium"} &rarr;</a>
        ${wa ? `<a href="${waUrl}" style="${btnStyle("#fef3c7","#b45309")}">Notificar al miembro por WhatsApp</a>` : ""}
        <button id="btn-uber" style="${btnStyle("#021B1A")}">🚗 Aplicar descuento Uber</button>
        ${esPremium(p) ? `<button id="btn-prof" style="${btnStyle("#021B1A")}">💼 Aplicar servicio profesional</button>` : ""}
        ${!aliadoInfo ? selectorAliadoHtml() : ""}
      `;
      bindSelectorAliado(() => cargarYRenderizar());
      bindBtnUber(p);
      bindBtnProfesional(p);
      bindBtnConfirmarCanje(aliadoInfo);
    }

    /* ---------- Descuento Uber (carro/moto/domicilio) ---------- */
    function fmtCOPUber(n) { return "$" + Number(n||0).toLocaleString("es-CO"); }

    function htmlUberIdentidad() {
      const waGuardado = localStorage.getItem("ecdlg_conductor_wa") || "";
      return `
        <div class="estado-ic" style="background:#fef3c7">🚗</div>
        <div class="estado-lbl" style="color:#b45309">Descuento Uber del Club</div>
        <div class="miembro-nombre" style="font-size:20px">¿Cuál es tu WhatsApp?</div>
        <p style="font-size:12px;color:#888;margin-bottom:16px">Conductor: se guarda en este celular para no pedírtelo cada vez.</p>
        <input id="uber-wa" type="tel" value="${waGuardado}" placeholder="300 000 0000" style="width:100%;padding:12px 14px;border:1px solid #ebebeb;border-radius:10px;font-size:16px;margin-bottom:10px;text-align:center">
        <p id="uber-error" class="error-msg" style="display:none;margin-bottom:10px;font-size:13px"></p>
        <button id="uber-continuar" style="${btnStyle("#021B1A")}">Continuar</button>
        <button id="uber-cancelar" style="${btnStyle("#EAF3EF","#021B1A")}">Cancelar</button>
      `;
    }
    function htmlUberTipo() {
      return `
        <div class="estado-ic" style="background:#fef3c7">🚗</div>
        <div class="miembro-nombre" style="font-size:20px">¿Qué tipo de servicio?</div>
        <div style="display:flex;flex-direction:column;gap:8px;margin-top:16px">
          <button class="uber-tipo-btn" data-tipo="carro" style="${btnStyle("#EAF3EF","#021B1A")}">Carro</button>
          <button class="uber-tipo-btn" data-tipo="moto" style="${btnStyle("#EAF3EF","#021B1A")}">Moto</button>
          <button class="uber-tipo-btn" data-tipo="domicilio" style="${btnStyle("#EAF3EF","#021B1A")}">Domicilio</button>
        </div>
      `;
    }
    function htmlUberMonto(tipoLbl) {
      return `
        <div class="estado-ic" style="background:#fef3c7">🚗</div>
        <div class="miembro-nombre" style="font-size:20px">${tipoLbl}</div>
        <p style="font-size:12px;color:#888;margin-bottom:14px">Ingresa el monto del viaje.</p>
        <input id="uber-monto" type="text" inputmode="numeric" placeholder="15.000" style="width:100%;padding:12px 14px;border:1px solid #ebebeb;border-radius:10px;font-size:16px;margin-bottom:12px;text-align:center">
        <div class="detalle"><span class="detalle__lbl">Descuento (10%)</span><span class="detalle__val" id="uber-ahorro" style="color:var(--verde)">$0</span></div>
        <p id="uber-error" class="error-msg" style="display:none;margin:10px 0;font-size:13px"></p>
        <button id="uber-aplicar" style="${btnStyle("#095544")}">Aplicar descuento</button>
      `;
    }
    function htmlUberExito(ahorro) {
      return `
        <div class="estado-ic estado-ic--ok">✓</div>
        <div class="estado-lbl estado-lbl--ok">¡Descuento aplicado!</div>
        <div class="miembro-nombre" style="font-size:24px">${fmtCOPUber(ahorro)}</div>
        <p style="font-size:13px;color:#888;margin-top:10px">Ahorro registrado. Ya queda en tu historial de conductor.</p>
      `;
    }

    function bindBtnUber(p) {
      document.getElementById("btn-uber")?.addEventListener("click", () => {
        card.innerHTML = htmlUberIdentidad();
        document.getElementById("uber-cancelar")?.addEventListener("click", () => cargarYRenderizar());
        document.getElementById("uber-continuar")?.addEventListener("click", async () => {
          const errEl = document.getElementById("uber-error");
          // Mismo normalizado que usa el resto del sitio (auth.js) -- el
          // "código" del conductor es su WhatsApp en 10 dígitos, sin el
          // indicativo 57 aunque venga duplicado.
          let wa = (document.getElementById("uber-wa")?.value || "").replace(/\D/g, "");
          while (wa.length > 10 && wa.startsWith("57")) wa = wa.slice(2);
          if (wa.length < 7) {
            if (errEl) { errEl.textContent = "Ingresa un WhatsApp válido."; errEl.style.display = "block"; }
            return;
          }
          localStorage.setItem("ecdlg_conductor_wa", wa);
          card.innerHTML = htmlUberTipo();
          document.querySelectorAll(".uber-tipo-btn").forEach(btn => {
            btn.addEventListener("click", () => abrirUberMonto(btn.dataset.tipo, btn.textContent.trim(), wa, p));
          });
        });
      });
    }

    function abrirUberMonto(tipo, tipoLbl, wa, p) {
      card.innerHTML = htmlUberMonto(tipoLbl);
      const montoInput = document.getElementById("uber-monto");
      montoInput.addEventListener("input", () => {
        const digits = montoInput.value.replace(/\D/g, "");
        montoInput.value = digits ? Number(digits).toLocaleString("es-CO") : "";
        const monto = parseInt(digits) || 0;
        document.getElementById("uber-ahorro").textContent = fmtCOPUber(Math.round(monto * 0.10));
      });

      document.getElementById("uber-aplicar")?.addEventListener("click", async () => {
        const errEl = document.getElementById("uber-error");
        errEl.style.display = "none";
        const monto = parseInt(montoInput.value.replace(/\D/g, "")) || 0;
        if (!monto) { errEl.textContent = "Ingresa el monto del viaje."; errEl.style.display = "block"; return; }

        const btn = document.getElementById("uber-aplicar");
        btn.disabled = true; btn.textContent = "Aplicando...";

        // Match exacto contra el WhatsApp ya normalizado del conductor (no
        // ilike difuso -- ese "código" es su identificador real, igual que
        // el que usan los miembros para iniciar sesión). Se busca por
        // es_conductor en vez de comparar el texto libre de "área", que se
        // rompe con un typo o un espacio de más.
        const { data: conductor } = await supabaseClient
          .from("profesionales_publico")
          .select("id, nombre")
          .eq("es_conductor", true)
          .eq("whatsapp", wa)
          .maybeSingle();

        if (!conductor) {
          errEl.textContent = "Ese WhatsApp no está registrado como conductor del Club.";
          errEl.style.display = "block";
          btn.disabled = false; btn.textContent = "Aplicar descuento";
          return;
        }

        const ahorro = Math.round(monto * 0.10);
        const { error } = await supabaseClient.from("viajes_conductor").insert({
          conductor_id: conductor.id,
          miembro_id: id,
          tipo, monto, descuento_pct: 10, ahorro,
        });

        if (error) {
          errEl.textContent = "No se pudo aplicar el descuento. Intenta de nuevo.";
          errEl.style.display = "block";
          btn.disabled = false; btn.textContent = "Aplicar descuento";
          return;
        }

        card.innerHTML = htmlUberExito(ahorro);
      });
    }

    /* ---------- Aplicar descuento del aliado actual (lo hace el aliado,
       justo después de escanear el QR -- antes solo quedaba un link suelto
       a todo el Directorio para que el aliado buscara su propia tarjeta
       entre todos los demás). El código del negocio ya se conoce (quedó
       guardado en este dispositivo al identificarse), así que no hay que
       volver a pedirlo. */
    function fmtCOPAliado(n) { return "$" + Number(n||0).toLocaleString("es-CO"); }
    function pctDerivadaAliado(p) {
      if (p.tipo !== "porcentaje") return null;
      if (p.descuento_pct) return p.descuento_pct;
      if (p.precio_normal && p.ahorro_fijo) return Math.round((p.ahorro_fijo / p.precio_normal) * 100);
      return null;
    }
    function badgePromoAliado(p) {
      const pct = pctDerivadaAliado(p);
      if (p.tipo === "porcentaje") return pct != null ? `${pct}%` : "% dcto.";
      if (p.tipo === "2x1") return "2×1";
      if (p.tipo === "monto_fijo") return p.ahorro_fijo ? `-${fmtCOPAliado(p.ahorro_fijo)}` : "Descuento";
      if (p.tipo === "precio_especial") return p.precio_descuento != null ? fmtCOPAliado(p.precio_descuento) : "Precio especial";
      if (p.tipo === "regalo") return "🎁";
      return "Promo";
    }
    function esPorcentajeUsableAliado(p) { return p.tipo === "porcentaje" && pctDerivadaAliado(p) != null; }
    function necesitaAhorroManualAliado(p) { return p.tipo === "2x1" || p.tipo === "personalizado"; }

    function promosAplicables(aliadoInfo) { return (aliadoInfo?.promociones || []).filter(x => !x.es_cumpleanos); }

    function htmlAliadoPromoLista(aliadoInfo) {
      const promos = promosAplicables(aliadoInfo);
      return `
        <div class="estado-ic" style="background:var(--verde-claro)">🏷️</div>
        <div class="miembro-nombre" style="font-size:20px">¿Qué promo aplicas?</div>
        <p style="font-size:12px;color:#888;margin-bottom:14px">${aliadoInfo.nombre}</p>
        <div style="display:flex;flex-direction:column;gap:8px">
          ${promos.map(p => `<button class="aliado-promo-btn" data-promo="${p.id}" style="${btnStyle("#EAF3EF","#021B1A")}">${badgePromoAliado(p)} · ${p.descripcion}</button>`).join("")}
        </div>
        <button id="aliado-promo-cancelar" style="${btnStyle("#f5f4f0","#021B1A")}">Cancelar</button>
      `;
    }
    function htmlAliadoDetalle(p, aliadoInfo) {
      const usaPorcentaje = esPorcentajeUsableAliado(p);
      const manual = necesitaAhorroManualAliado(p);
      return `
        <div class="estado-ic" style="background:var(--verde-claro)">🏷️</div>
        <div class="miembro-nombre" style="font-size:20px">${badgePromoAliado(p)} · ${aliadoInfo.nombre}</div>
        <p style="font-size:12px;color:#888;margin-bottom:14px">${p.descripcion}</p>
        ${usaPorcentaje ? `
          <input id="aliado-monto" type="text" inputmode="numeric" placeholder="Valor de la compra" style="width:100%;padding:12px 14px;border:1px solid #ebebeb;border-radius:10px;font-size:16px;margin-bottom:12px;text-align:center">
          <div class="detalle"><span class="detalle__lbl">Ahorra</span><span class="detalle__val" id="aliado-ahorro-prev" style="color:var(--verde)">$0</span></div>
        ` : manual ? `
          <p style="font-size:12px;color:#888;margin-bottom:10px">Escribe cuánto ahorró el miembro con este beneficio, para que quede reflejado en su ahorro total.</p>

        ` : `

        <button id="aliado-cancelar" style="${btnStyle("#f5f4f0","#021B1A")}">Cancelar</button>
      `;
    }
    function htmlAliadoExito(ahorro) {
      return `
        <div class="estado-ic estado-ic--ok">✓</div>
        <div class="estado-lbl estado-lbl--ok">¡Descuento aplicado!</div>

    function abrirAliadoDetalle(p, miembro, aliadoInfo) {
      card.innerHTML = htmlAliadoDetalle(p, aliadoInfo);
      const usaPorcentaje = esPorcentajeUsableAliado(p);
      const manual = necesitaAhorroManualAliado(p);
      const montoInput = document.getElementById("aliado-monto");
      let monto = 0;
      montoInput?.addEventListener("input", () => {
        const digits = montoInput.value.replace(/\D/g, "");
        montoInput.value = digits ? Number(digits).toLocaleString("es-CO") : "";
        monto = parseInt(digits) || 0;
        if (usaPorcentaje) {
          const pct = pctDerivadaAliado(p) / 100;
          const el = document.getElementById("aliado-ahorro-prev");
          if (el) el.textContent = fmtCOPAliado(Math.round(monto * pct));

      document.getElementById("aliado-cancelar")?.addEventListener("click", () => cargarYRenderizar());
      document.getElementById("aliado-confirmar")?.addEventListener("click", async () => {

        if (usaPorcentaje && !monto) { if (errEl) { errEl.textContent = "Ingresa el valor de la compra."; errEl.style.display = "block"; } return; }
        if (manual && !monto) { if (errEl) { errEl.textContent = "Escribe cuánto ahorró."; errEl.style.display = "block"; } return; }

        const ahorro = usaPorcentaje ? Math.round(monto * (pctDerivadaAliado(p) / 100)) : manual ? monto : (p.ahorro_fijo || 0);

        const btn = document.getElementById("aliado-confirmar");
        btn.disabled = true; btn.textContent = "Aplicando...";

        const { data: res, error } = await supabaseClient.rpc("aplicar_descuento_directorio", {
          p_miembro_id: id, p_aliado_id: aliadoInfo.id, p_codigo: aliadoCodigo,
          p_categoria: aliadoInfo.categoria, p_descuento_pct: badgePromoAliado(p),
          p_compra: usaPorcentaje ? monto : null, p_ahorro: ahorro || 0,
        });

        if (error || !res?.ok) {
          if (errEl) { errEl.textContent = "No se pudo aplicar el descuento. Intenta de nuevo."; errEl.style.display = "block"; }
          btn.disabled = false; btn.textContent = "Aplicar descuento";
          return;
        }

        if (miembro.whatsapp) {
          const bodyPayload = usaPorcentaje
            ? { to: miembro.whatsapp, contentSid: CONTENT_SID_DESCUENTO_CONFIRMADO_PCT, contentVariables: { "1": aliadoInfo.nombre, "2": fmtCOPAliado(ahorro), "3": fmtCOPAliado(monto) } }
            : { to: miembro.whatsapp, contentSid: CONTENT_SID_DESCUENTO_CONFIRMADO_BENEFICIO, contentVariables: { "1": aliadoInfo.nombre, "2": p.descripcion } };
          fetch("https://egwaedadpqfwnbfosiao.supabase.co/functions/v1/whatsapp-send-3", {
            method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(bodyPayload),
          }).catch(() => {});
        }

        card.innerHTML = htmlAliadoExito(ahorro);
      });
    }

    function bindBtnAplicarAliado(miembro, aliadoInfo) {
      document.getElementById("btn-aplicar-aliado")?.addEventListener("click", () => {
        const promos = promosAplicables(aliadoInfo);
        if (!promos.length) return;
        if (promos.length === 1) { abrirAliadoDetalle(promos[0], miembro, aliadoInfo); return; }

    /* ---------- Descuento con un profesional (Premium/Vitalicia) ---------- */
    function esPremium(p) { return p.plan === "premium" || p.plan === "vitalicia"; }
    function fmtCOPProf(n) { return "$" + Number(n||0).toLocaleString("es-CO"); }

    function htmlProfIdentidad() {

      `;

    function bindBtnProfesional(p) {
      document.getElementById("btn-prof")?.addEventListener("click", () => {
        card.innerHTML = htmlProfIdentidad();
        document.getElementById("prof-cancelar")?.addEventListener("click", () => cargarYRenderizar());
        document.getElementById("prof-continuar")?.addEventListener("click", async () => {

          // Mismo match exacto que usan los conductores de Uber (no ilike

          let wa = (document.getElementById("prof-wa")?.value || "").replace(/\D/g, "");
          while (wa.length > 10 && wa.startsWith("57")) wa = wa.slice(2);

            if (errEl) { errEl.textContent = "Ingresa un WhatsApp válido."; errEl.style.display = "block"; }

          localStorage.setItem("ecdlg_profesional_wa", wa);

          const { data: profesional } = await supabaseClient

            .select("id, nombre, whatsapp")
            .eq("whatsapp", wa)
            .maybeSingle();

          const { data: servicios } = await supabaseClient

            .select("id, nombre, tarifa, descuento_pct, es_cortesia")
            .eq("profesional_id", profesional.id)
            .order("orden");

          if (!servicios || !servicios.length) {

              <div class="estado-ic estado-ic--no">✗</div>
              <div class="estado-lbl estado-lbl--no">Sin servicios cargados</div>
              <p class="error-msg" style="margin-top:8px">Este profesional aún no tiene servicios cargados en el Club.</p>
            `;

          }

          card.innerHTML = htmlProfServicios(profesional.nombre, servicios);
          document.querySelectorAll(".prof-serv-btn").forEach(btn => {

              const pct = parseInt(servicio.descuento_pct) || 0;
              const ahorro = servicio.es_cortesia
                ? (servicio.tarifa || 0)
                : Math.round((servicio.tarifa || 0) * pct / 100);

              const { error } = await supabaseClient.from("servicios_aplicados").insert({
                profesional_id: profesional.id,
                servicio_id: servicio.id,
                miembro_id: id,
                nombre_servicio: servicio.nombre,

              if (error) {

              card.innerHTML = htmlProfExito(ahorro);

              if (p.whatsapp) {

                  headers: { "Content-Type": "application/json" },
                  body: JSON.stringify({
                    to: p.whatsapp,
                    contentSid: CONTENT_SID_DESCUENTO_CONFIRMADO_PROFESIONAL,

    function renderNo(msg) {
      card.innerHTML = `
        <div class="estado-ic estado-ic--no">✗</div>
        <div class="estado-lbl estado-lbl--no">Membresía no válida</div>
        <p class="error-msg" style="margin-top:8px">${msg}</p>
        <hr class="divider">
        <div class="detalle"><span class="detalle__lbl">Estado</span><span class="badge badge--no"><span class="dot"></span> Inactivo</span></div>
        <p style="margin-top:20px;font-size:13px;color:#888">No se puede aplicar el descuento. El miembro debe renovar su membresía.</p>
      `;
    }

    // QR sin ID: esto siempre se sabe al instante, no hace falta esperar ni un timeout
    if (!id) {
      renderNo("Este QR no contiene un ID de miembro válido. Pide al miembro que muestre su ClubCard.");
      return;
    }

    async function cargarAliadoInfo() {
      if (!aliadoId) return null;
      const { data } = await supabaseClient
        .from("aliados_publico")
        .select("id, nombre, categoria, descuento, sellos_activo, sellos_meta, sellos_premio_tipo, sellos_premio_desc")
        .eq("id", aliadoId).maybeSingle();
      if (!data) return null;
      // "promociones" no viene embebida (ese embed resuelve contra la tabla
      // protegida y acá se está consultando la vista pública) -- se trae
      // aparte, igual que ya hace directorio.js.
      const { data: promos } = await supabaseClient
        .from("promociones").select("id, tipo, descripcion, precio_normal, precio_descuento, ahorro_fijo, descuento_pct, es_cumpleanos, activa")
        .eq("aliado_id", aliadoId).eq("activa", true);
      data.promociones = promos || [];
      return data;
    }

    // Misma condición que avisar-cumpleanos.ts/MisCortesias.html: Premium o
    // Vitalicia, cumpleaños hoy (hora Colombia) y categoría del aliado dentro
    // de sus intereses (o sin intereses marcados = aplica a cualquiera).
    function calcularCortesiaCumple(miembro, aliadoInfo) {
      if (!aliadoInfo) return null;
      if (miembro.plan !== "premium" && miembro.plan !== "vitalicia") return null;
      if (!miembro.fecha_nacimiento) return null;
      const hoyCo = new Date(Date.now() - 5 * 60 * 60 * 1000);
      const mesDia = `${String(hoyCo.getUTCMonth() + 1).padStart(2, "0")}-${String(hoyCo.getUTCDate()).padStart(2, "0")}`;
      if (miembro.fecha_nacimiento.slice(5, 10) !== mesDia) return null;
      const intereses = (Array.isArray(miembro.categorias_interes) ? miembro.categorias_interes : []).map(c => c.trim().toLowerCase());
      const catsAliado = (aliadoInfo.categoria || "").split(",").map(c => c.trim().toLowerCase());
      const coincide = intereses.length === 0 || catsAliado.some(c => intereses.includes(c));
      if (!coincide) return null;
      const promo = (aliadoInfo.promociones || []).find(p => p.es_cumpleanos && p.activa);
      return promo?.descripcion || null;
    }

    async function cargarYRenderizar() {
      try {
        const [{ data, error }, aliadoInfo] = await conTimeout(Promise.all([
          supabaseClient.rpc("perfil_publico_por_id", { p_id: id }).single(),
          cargarAliadoInfo(),
        ]), 12000);

        if (error || !data) {
          renderNo("Miembro no encontrado. Verifica que el QR sea válido.");
          return;
        }

        if (aliadoInfo) aliadoInfo.cortesiaCumple = calcularCortesiaCumple(data, aliadoInfo);

        const limite = LIMITE_DESCUENTOS[data.plan] ?? 2;
        let usos = 0, sellosActuales = 0;

        // El conteo de usos/sellos de ESTE aliado con ESTE miembro se trae por
        // una función que verifica el código del negocio server-side (RLS ya
        // no deja leer "descuentos"/"sellos_canjes" de otra persona desde el
        // navegador, ni siquiera para mostrar un número).
        if (aliadoId && aliadoCodigo) {
          const { data: estado } = await supabaseClient.rpc("estado_aliado_para_miembro", {
            p_miembro_id: id, p_aliado_id: aliadoId, p_codigo: aliadoCodigo,
          });
          if (estado?.ok) {
            usos = estado.usos_aliado || 0;
            sellosActuales = estado.sellos_actuales || 0;
          }
        } else if (limite !== Infinity) {
          const { data: total } = await supabaseClient.rpc("contar_usos_mes_miembro", { p_miembro_id: id });
          usos = total || 0;
        }

        if (limite !== Infinity && usos >= limite) {
          renderLimite(data, limite, aliadoInfo, sellosActuales);
        } else {
          renderOk(data, usos, limite, aliadoInfo, sellosActuales);
        }
      } catch (_) {
        renderNo("No se pudo verificar por un problema de conexión. Intenta de nuevo.");
      }
    }

    // ---------- Puerta de seguridad: código dinámico de 4 dígitos ----------
    // El QR por sí solo ya no es suficiente (una foto del QR serviría para
    // siempre) -- antes de mostrar nada del miembro, se exige el código que
    // aparece al voltear su ClubCard, válido solo unos minutos.
    function renderCodigoGate(mensajeError) {
      card.innerHTML = `
        <div class="estado-ic" style="background:var(--verde-claro)">🔒</div>
        <div class="estado-lbl" style="color:var(--tinta)">Verificación de seguridad</div>
        <p style="font-size:13px;color:#777;margin:10px 0 18px">Pídele al miembro el código de 4 dígitos que aparece al voltear su ClubCard.</p>
        <input id="codigo-input" type="text" inputmode="numeric" maxlength="4" placeholder="0000" autocomplete="off"
          style="width:100%;padding:14px;border:1.5px solid #ddd;border-radius:12px;font-size:30px;letter-spacing:.3em;text-align:center;font-weight:700;margin-bottom:10px;font-family:inherit">
        ${mensajeError ? `<p class="error-msg" style="margin-bottom:10px">${mensajeError}</p>` : ""}
        <button id="btn-verificar-codigo" style="${btnStyle('#095544')}">Verificar código</button>
      `;
      const input = document.getElementById("codigo-input");
      input?.addEventListener("input", () => { input.value = input.value.replace(/\D/g, "").slice(0, 4); });
      input?.addEventListener("keydown", (e) => { if (e.key === "Enter") verificarCodigoYContinuar(); });
      input?.focus();
      document.getElementById("btn-verificar-codigo")?.addEventListener("click", verificarCodigoYContinuar);
    }

    async function verificarCodigoYContinuar() {
      const input = document.getElementById("codigo-input");
      const codigo = (input?.value || "").trim();
      if (codigo.length !== 4) { renderCodigoGate("Ingresa los 4 dígitos."); return; }
      const btn = document.getElementById("btn-verificar-codigo");
      if (btn) { btn.disabled = true; btn.textContent = "Verificando…"; }
      try {
        const { data, error } = await conTimeout(
          supabaseClient.rpc("verificar_codigo_miembro", { p_miembro_id: id, p_codigo: codigo }), 10000
        );
        if (error) {
          renderCodigoGate("No se pudo verificar por un problema de conexión. Intenta de nuevo.");
          return;
        }
        if (data === "bloqueado") {
          renderCodigoGate("Demasiados intentos fallidos. Espera 2 minutos e inténtalo de nuevo.");
          return;
        }
        if (data !== "ok") {
          renderCodigoGate("Código incorrecto o vencido. Pídele al miembro que voltee su ClubCard de nuevo.");
          return;
        }
        cargarYRenderizar();
      } catch (_) {
        renderCodigoGate("No se pudo verificar por un problema de conexión. Intenta de nuevo.");
      }
    }

    if (!id) {
      renderNo("Código QR inválido. Escanea el código desde la ClubCard del miembro.");
    } else {
      renderCodigoGate();
    }
    })();
  </script>

</body>
</html>
