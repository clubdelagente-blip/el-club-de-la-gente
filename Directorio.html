<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <script src="https://js.sentry-cdn.com/c008db963bd16390827cbba643292144.min.js" crossorigin="anonymous"></script>
  <script async src="https://www.googletagmanager.com/gtag/js?id=G-K062DHDKP"></script>
  <script>window.dataLayer=window.dataLayer||[];function gtag(){dataLayer.push(arguments);}gtag('js',new Date());gtag('config','G-K062DHDKP');</script>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>El Club de la Gente — Directorio de aliados</title>
  <link rel="manifest" href="manifest.json">
  <link rel="icon" href="icon-club.png?v=2" type="image/png">
  <link rel="apple-touch-icon" href="icon-club.png?v=2">
  <meta name="theme-color" content="#095544">
  <script>if ("serviceWorker" in navigator) window.addEventListener("load", () => navigator.serviceWorker.register("/sw.js").catch(() => {}));</script>
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="El Club">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Anton&family=Inter:wght@400;500;600;700&family=Rye&family=Permanent+Marker&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css?v=83">
  <link rel="stylesheet" href="directorio.css?v=17">
</head>
<body>
  <div class="page-loader" id="page-loader"><img src="icon-club.png" alt=""></div>
  <script>(function(){var l=document.getElementById('page-loader');function ocultar(){if(!l)return;l.classList.add('is-hidden');setTimeout(function(){l.remove();},400);}window.addEventListener('load',ocultar);setTimeout(ocultar,4000);})();</script>

  <div class="grain" aria-hidden="true"></div>

  <!-- ============================================================
       HEADER DEL DIRECTORIO
       ============================================================ -->
  <header class="dir-top">
    <div class="wrap">
      <a class="logo" href="El Club de la Gente.html" aria-label="El Club de la Gente">
        <img src="logo-club.png" alt="El Club de la Gente" style="height:38px;width:auto;">
      </a>

      <div class="dir-top__right">
        <span class="dir-top__txt">Directorio de aliados · Fusagasugá</span>
      </div>
    </div>
  </header>

  <!-- ============================================================
       HERO EDITORIAL
       ============================================================ -->
  <section class="dir-hero">
    <div class="wrap">
      <h1 class="display">Todos los aliados,<br>todo tu ahorro <span class="italic-verde">en un solo lugar.</span></h1>
    </div>
  </section>

  <!-- ============================================================
       BUSCADOR + FILTROS
       ============================================================ -->
  <div class="dir-tools">
    <div class="wrap">
      <div class="dir-search">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
        <input type="text" id="dir-search" placeholder="Busca por nombre o categoría…" autocomplete="off">
      </div>
      <div class="dir-filtros" id="dir-filtros"></div>
    </div>
  </div>

  <!-- ============================================================
       GRID DE ALIADOS
       ============================================================ -->
  <section class="wrap">
    <div class="dir-meta">
      <span class="dir-meta__count" id="dir-count"></span>
    </div>
    <div class="dir-grid" id="dir-grid"></div>
  </section>


  <!-- ============================================================
       SHEET + TOAST
       ============================================================ -->
  <div class="sheet-overlay" id="sheet-overlay"></div>
  <aside class="sheet" id="sheet" role="dialog" aria-modal="true">
    <div class="sheet__grip"></div>
    <button class="sheet__close" id="sheet-close" aria-label="Cerrar"><i data-lucide="x"></i></button>
    <div class="sheet__scroll" id="sheet-scroll">
      <div class="sheet__inner" id="sheet-inner"></div>
    </div>
  </aside>

  <div class="toast" id="toast"></div>

  <!-- Barra de navegación inferior (solo móvil) -- misma barra de Perfil.html,
       duplicada acá porque es otra página (no carga dashboard.css). -->
  <nav class="bottom-tabbar" aria-label="Navegación principal">
    <a class="sb-link" href="Perfil.html"><i data-lucide="layout-dashboard"></i> Inicio</a>
    <a class="sb-link" href="Perfil.html?panel=perfil"><i data-lucide="user"></i> Perfil</a>
    <a class="sb-link" href="Perfil.html?panel=soporte"><i data-lucide="life-buoy"></i> Soporte</a>
    <a class="sb-link is-active" href="Directorio.html"><i data-lucide="store"></i> Aliados</a>
  </nav>

  <!-- ============================================================
       SCRIPTS
       ============================================================ -->
  <script src="https://unpkg.com/lucide@0.460.0/dist/umd/lucide.min.js"></script>
  <script src="gesto-volver.js?v=1"></script>
  <script type="module" src="directorio.js?v=57"></script>

  <template id="__bundler_thumbnail">
    <svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
      <rect width="100" height="100" fill="#F1F7F6"/>
      <rect x="30" y="30" width="40" height="40" rx="4" fill="none" stroke="#021B1A" stroke-width="3"/>
      <rect x="38" y="38" width="10" height="10" fill="#095544"/>
      <rect x="52" y="38" width="10" height="10" fill="#021B1A"/>
      <rect x="38" y="52" width="10" height="10" fill="#021B1A"/>
      <rect x="52" y="52" width="10" height="10" fill="#095544"/>
    </svg>
  </template>

</body>
</html>
