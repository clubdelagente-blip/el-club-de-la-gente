/* ---- ADMIN CMS — inline para evitar caché ---- */
import { createClient } from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm';

const supabase = createClient(
  "https://egwaedadpqfwnbfosiao.supabase.co",
  "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImVnd2FlZGFkcHFmd25iZm9zaWFvIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODA3Njc2ODcsImV4cCI6MjA5NjM0MzY4N30.NrBPX8HhTcs_y-QG3o_GoEAednFc0TqUunkQe1dblT4"
);
const $ = (s) => document.querySelector(s);
const ic = (n) => `<i data-lucide="${n}"></i>`;
// Escapa texto de usuarios (postulaciones publicas, formularios de aliados/profesionales)
// antes de insertarlo en innerHTML -- sin esto, cualquiera podia mandar un <script>
// en el nombre del negocio y que se ejecutara en la sesion del admin al revisarlo.
const esc = (s) => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
// Cliente aislado (sin persistir sesión) para crear cuentas de aliados desde
// el Admin sin reemplazar la sesión del administrador logueado -- signUp()
// en el cliente principal movería la sesión activa a la cuenta recién creada.
function clienteAislado(){
  return createClient(
    "https://egwaedadpqfwnbfosiao.supabase.co",
    "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImVnd2FlZGFkcHFmd25iZm9zaWFvIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODA3Njc2ODcsImV4cCI6MjA5NjM0MzY4N30.NrBPX8HhTcs_y-QG3o_GoEAednFc0TqUunkQe1dblT4",
    { auth: { persistSession: false, autoRefreshToken: false } }
  );
}
let _aliados=[], _anuncios=[], _programas=[], _profesionales=[], _gastos=[], _categoriasGasto=[], _pagos=[], _contMes=null, _contGastosMes=[], _contPagosMes=[], _contConfig={iva_pct:19,ica_pct:0.92,fundadores_pct:40,renta_pct:35,comision_tienda_pct:10};
let _pedidosCom=[], _ingresosManuales=[], _categoriasIngreso=[], _contComisionMes=[], _contIngManMes=[], _contFilasIngreso=[], _contFiltroIngreso=null;

const CATS=['Restaurante / Cafetería','Salud y bienestar','Belleza y estética','Barbería','Odontología','Veterinaria','Ropa y accesorios','Supermercado / Tienda','Educación','Deporte y gym','Tecnología'];
const PLANES_VIS=[{val:'gratis',lbl:'Gratis'},{val:'basica',lbl:'Básica'},{val:'premium',lbl:'Premium'}];

function toast(msg){const t=$("#ad-toast");if(!t)return;t.textContent=msg;t.classList.add("is-show");setTimeout(()=>t.classList.remove("is-show"),3000);}
// Campos de dinero: texto con separador de miles en vivo (un <input type="number"> interpreta
// el "." que la gente escribe para miles como punto decimal, ej. "62.000" -> 62).
function formatearInputMoneda(input){
  if(!input)return;
  input.addEventListener('input',()=>{
    const digits=input.value.replace(/\D/g,'');
    input.value=digits?Number(digits).toLocaleString('es-CO'):'';
  });
}
function valorMoneda(input){return parseInt((input?.value||'').replace(/\D/g,''))||0;}
function abrirModal(t,s,b){$("#modal-title").textContent=t;$("#modal-sub").textContent=s;$("#modal-body").innerHTML=b;$("#ad-modal-ov").classList.add("is-open");if(window.lucide)lucide.createIcons();}
async function subirImagen(file){const ext=file.name.split('.').pop();const path=`${Date.now()}-${Math.random().toString(36).substr(2,5)}.${ext}`;const{error}=await supabase.storage.from('contenido').upload(path,file);if(error)throw error;return supabase.storage.from('contenido').getPublicUrl(path).data.publicUrl;}

/* ---- DASHBOARD (datos reales) ---- */
const MES_LBL_DASH=["Ene","Feb","Mar","Abr","May","Jun","Jul","Ago","Sep","Oct","Nov","Dic"];
function tiempoRelativo(iso){
  const min=Math.floor((Date.now()-new Date(iso).getTime())/60000);
  if(min<1)return'ahora mismo';
  if(min<60)return`hace ${min} min`;
  const h=Math.floor(min/60);if(h<24)return`hace ${h} h`;
  const d=Math.floor(h/24);return`hace ${d} d`;
}
async function cargarDashboardReal(){
  const hoy=new Date();
  const enMes=(iso,ref)=>{const d=new Date(iso);return d.getFullYear()===ref.getFullYear()&&d.getMonth()===ref.getMonth();};
  const mesAnt=new Date(hoy.getFullYear(),hoy.getMonth()-1,1);
  const inicioSemana=new Date(hoy.getTime()-7*24*60*60*1000);

  const[{data:perfiles},{data:pagos},{data:descuentos}]=await Promise.all([
    supabase.from('perfiles').select('nombre,plan,created_at').order('created_at',{ascending:false}),
    supabase.from('pagos').select('monto,plan,created_at,perfiles(nombre)').order('created_at',{ascending:false}),
    supabase.from('descuentos').select('aliado_nombre,ahorro,compra,created_at').order('created_at',{ascending:false}),
  ]);
  const P=perfiles||[],PG=pagos||[],D=descuentos||[];

  const miembrosActivos=P.filter(p=>['gratis','basica','premium','vitalicia'].includes(p.plan)).length;
  const miembrosNuevos=P.filter(p=>enMes(p.created_at,hoy)).length;

  const ingresosMes=PG.filter(p=>enMes(p.created_at,hoy)).reduce((s,p)=>s+(p.monto||0),0);
  const ingresosMesAnt=PG.filter(p=>enMes(p.created_at,mesAnt)).reduce((s,p)=>s+(p.monto||0),0);
  const ingresosTrend=ingresosMesAnt?Math.round((ingresosMes-ingresosMesAnt)/ingresosMesAnt*100):null;

  const descuentosMes=D.filter(d=>enMes(d.created_at,hoy));
  const descuentosSemana=D.filter(d=>new Date(d.created_at)>=inicioSemana).length;
  const ahorroAcum=D.reduce((s,d)=>s+(d.ahorro||0),0);

  const usosPorAliado={};
  descuentosMes.forEach(d=>{const n=d.aliado_nombre||'—';usosPorAliado[n]=(usosPorAliado[n]||0)+1;});
  const ranking=Object.entries(usosPorAliado).sort((a,b)=>b[1]-a[1]).slice(0,5);

  const desglose={basica:{miembros:0,valor:0},premium:{miembros:0,valor:0}};
  PG.filter(p=>enMes(p.created_at,hoy)).forEach(p=>{
    const key=p.plan==='premium'?'premium':'basica';
    desglose[key].miembros++;desglose[key].valor+=(p.monto||0);
  });

  const meses=[];
  for(let i=5;i>=0;i--){const d=new Date(hoy.getFullYear(),hoy.getMonth()-i,1);meses.push({y:d.getFullYear(),m:d.getMonth(),total:0});}
  PG.forEach(p=>{const d=new Date(p.created_at);const slot=meses.find(x=>x.y===d.getFullYear()&&x.m===d.getMonth());if(slot)slot.total+=(p.monto||0);});
  const maxMes=Math.max(1,...meses.map(x=>x.total));

  const feed=[
    ...P.slice(0,5).map(p=>({tipo:'miembro',txt:`<b>${esc(p.nombre)}</b> se unió al plan ${p.plan==='premium'?'Premium':p.plan==='basica'?'Básica':(esc(p.plan)||'—')}`,fecha:p.created_at})),
    ...PG.slice(0,5).map(p=>({tipo:'pago',txt:`Pago recibido de <b>${esc(p.perfiles?.nombre)||'un miembro'}</b> · ${COP(p.monto)}`,fecha:p.created_at})),
    ...D.slice(0,5).map(d=>({tipo:'descuento',txt:`<b>${esc(d.aliado_nombre)||'Aliado'}</b> · descuento aplicado · ahorro ${COP(d.ahorro||0)}`,fecha:d.created_at})),
  ].sort((a,b)=>new Date(b.fecha)-new Date(a.fecha)).slice(0,8);

  $("#p-dashboard").innerHTML=`
    <div class="ad-metrics">
      ${window.metric('users',miembrosActivos.toLocaleString('es-CO'),'Miembros activos',`${miembrosNuevos} nuevos este mes`)}
      ${window.metric('banknote',COP(ingresosMes),'Ingresos del mes','vs. mes anterior',ingresosTrend!=null?`${ingresosTrend>=0?'+':''}${ingresosTrend}%`:'',ingresosTrend>=0?'up':'down')}
      ${window.metric('ticket-percent',window.nf.format(descuentosMes.length),'Descuentos usados',`${descuentosSemana} esta semana`)}
      ${window.metric('sparkles',COP(ahorroAcum),'Ahorro generado','acumulado total')}
    </div>
    <div class="ad-grid">
      <div class="ad-card">
        <div class="ad-card__head"><div><div class="ad-card__title">Ingresos por mes</div><div class="ad-card__sub">Recaudo de membresías · ${hoy.getFullYear()}</div></div></div>
        <div class="ad-chart">${meses.map((x,i)=>`

let _miembros=[];
async function cargarMiembrosReal(tab,q){
  const[{data:perfiles},{data:descuentos}]=await Promise.all([
    supabase.from('perfiles').select('id,nombre,whatsapp,plan,barrio,created_at').order('created_at',{ascending:false}),
    supabase.from('descuentos').select('miembro_id,ahorro'),
  ]);
  const ahorroPorMiembro={};
  (descuentos||[]).forEach(d=>{ahorroPorMiembro[d.miembro_id]=(ahorroPorMiembro[d.miembro_id]||0)+(d.ahorro||0);});
  _miembros=(perfiles||[]).map(p=>({
    id:p.id,
    nombre:p.nombre||'(sin nombre)',
    whatsapp:p.whatsapp||'',
    plan:p.plan||'sin_plan',
    barrio:p.barrio||'—',
    fecha:new Date(p.created_at).toLocaleDateString('es-CO',{day:'numeric',month:'short',year:'numeric'}),

    ahorro:ahorroPorMiembro[p.id]||0,
  }));
  filtrarMiembrosReal(tab,q);
}
function filtrarMiembrosReal(tab,q){
  const qn=(q||'').trim().toLowerCase();

    const okTab=!tab||tab==='todos'||(tab==='inactivos'?u.estado==='inactivo':u.plan===tab&&u.estado==='activo');
    const okQ=!qn||u.nombre.toLowerCase().includes(qn);

  });
  const body=$('#m-body');
  if(!body)return;
  body.innerHTML=list.length?list.map(u=>`
    <tr data-miembro="${u.id}">
      <td><div class="ad-cell-user"><span class="ad-av">${esc(window.ini(u.nombre))}</span><div><div class="ad-cell-user__name">${esc(u.nombre)}</div><div class="ad-table__num">Desde ${u.fecha}</div></div></div></td>
      <td><span class="ad-pill ${u.plan}"><span class="d"></span>${window.planLbl(u.plan)}</span></td>

  if(window.lucide)lucide.createIcons();
}

async function enviarDifusionReal(audienciaId){
  const aud=_difusionAudiencias.find(a=>a.id===audienciaId)||_difusionAudiencias[0];
  const msg=$("#ag-bc-msg")?.value.trim();
  if(!msg){toast('Escribe un mensaje');return;}
  if(!aud||!aud.list.length){toast('Esa audiencia no tiene miembros con WhatsApp registrado');return;}
  if(!confirm(`¿Enviar este mensaje a ${aud.list.length} miembros (${aud.lbl})?`))return;

  const btn=$("#ag-bc-send");
  if(btn)btn.disabled=true;
  const progEl=$("#ag-bc-progress");
  if(progEl)progEl.style.display='block';

  let enviados=0,fallidos=0;
  for(const p of aud.list){
    const primerNombre=(p.nombre||'').trim().split(' ')[0]||'';
    const texto=msg.replace(/\{nombre\}/gi,primerNombre);
    try{
      const{error}=await supabase.functions.invoke('whatsapp-send-3',{body:{to:p.whatsapp,body:texto}});
      if(error)fallidos++;else enviados++;
    }catch(_){fallidos++;}
    if(progEl)progEl.textContent=`Enviando… ${enviados+fallidos}/${aud.list.length} (✓ ${enviados} · ✗ ${fallidos})`;
    await new Promise(r=>setTimeout(r,300));
  }

  await supabase.from('difusiones').insert({
    mensaje:msg,audiencia:aud.lbl,total_destinatarios:aud.list.length,enviados,fallidos,
  });

  if(btn)btn.disabled=false;
  toast(`Difusión enviada: ${enviados} de ${aud.list.length} (${fallidos} fallidos)`);
  window.cerrarModal?.();
}
window.enviarDifusionReal=enviarDifusionReal;

let _agConvsAll=[], _agActive=null, _agQ='';
function _agTiempo(iso){return new Date(iso).toLocaleTimeString('es-CO',{hour:'numeric',minute:'2-digit',hour12:true}).toLowerCase();}

async function cargarAgenteReal(){
  const[{data:conv},{data:perfiles}]=await Promise.all([
    supabase.from('conversaciones').select('whatsapp,rol,contenido,created_at').order('created_at',{ascending:true}),
    supabase.from('perfiles').select('id,nombre,whatsapp,plan'),
  ]);
  const C=conv||[],P=perfiles||[];
  const porNumero={};
  C.forEach(m=>{
    const key=(m.whatsapp||'').replace(/\D/g,'');
    if(!key)return;
    (porNumero[key]=porNumero[key]||[]).push(m);
  });
  const buscarPerfil=numero=>P.find(p=>{
    const d=(p.whatsapp||'').replace(/\D/g,'');
    return d && (d.endsWith(numero)||numero.endsWith(d));
  });
  _agConvsAll=Object.entries(porNumero).map(([numero,msgs])=>{
    const perfil=buscarPerfil(numero);
    const last=msgs[msgs.length-1];
    return{
      numero,msgs,
      nombre:perfil?.nombre||('+57 '+numero),
      plan:perfil?.plan||null,
      miembroId:perfil?.id||null,
      lastText:(last?.contenido||'').slice(0,80),
      lastFrom:last?.rol,
      lastTime:last?.created_at,
      necesitaRespuesta:last?.rol==='user',
    };
  }).sort((a,b)=>new Date(b.lastTime)-new Date(a.lastTime));

  if(!_agActive||!_agConvsAll.find(c=>c.numero===_agActive))_agActive=_agConvsAll[0]?.numero||null;

  const titleEl=$("#ag-title");if(titleEl)titleEl.textContent=`Conversaciones · ${_agConvsAll.length} chats`;
  const nPend=_agConvsAll.filter(c=>c.necesitaRespuesta).length;
  const navEl=$("#ag-nav-count");if(navEl){navEl.textContent=nPend?nPend:'';navEl.style.display=nPend?'':'none';}
  renderAgConvsReal();
  renderAgThreadReal();
}

    btn.disabled=true;let imagen_url=$("#pf-img-url")?.value||null;
    const file=$("#pf-img")?.files?.[0];if(file)try{imagen_url=await subirImagen(file);}catch(_){}
    const payload={nombre,area:$("#pf-area")?.value.trim()||null,whatsapp:$("#pf-wa")?.value.trim()||null,descripcion:$("#pf-desc")?.value.trim()||null,imagen_url,activo:true};
    const id=btn.dataset.id;

/* ---- PROMOCIONES ---- */
let _promos=[];
async function cargarYMostrarPromociones(aliadoId,aliadoNombre){
  const{data}=await supabase.from('promociones').select('*').eq('aliado_id',aliadoId).order('created_at',{ascending:false});
  _promos=data||[];
  abrirModal(`Promociones — ${aliadoNombre}`,`${_promos.length} promoción${_promos.length!==1?'es':''} registrada${_promos.length!==1?'s':''}`,htmlListaPromociones(_promos,aliadoId,aliadoNombre));
  if(window.lucide)lucide.createIcons();
  bindListaPromociones(aliadoId,aliadoNombre);
}
function htmlListaPromociones(promos,aliadoId,aliadoNombre){
  const TIPO_LBL={porcentaje:'Porcentaje','2x1':'2×1',monto_fijo:'Monto fijo',precio_especial:'Precio especial',regalo:'Regalo',personalizado:'Personalizado'};
  const lista=promos.length?promos.map(p=>{
    const ahorro=p.ahorro_fijo?`$${p.ahorro_fijo.toLocaleString('es-CO')} de ahorro`:'Ahorro variable';
    return `<div style="display:flex;gap:12px;padding:14px;background:rgba(26,26,24,.04);border:1px solid rgba(26,26,24,.1);border-radius:10px;margin-bottom:8px">
      ${p.foto_url?`<img src="${p.foto_url}" style="width:52px;height:52px;object-fit:cover;border-radius:8px;flex-shrink:0">`:''}
      <div style="flex:1;min-width:0">
        <div style="display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:2px">
          <span style="font-weight:600;font-size:14px">${p.descripcion}</span>
          <span style="font-size:11px;padding:2px 8px;border-radius:20px;background:${p.activa?'rgba(31,157,60,.12)':'rgba(26,26,24,.08)'};color:${p.activa?'#1a7a3c':'#888'};font-weight:600">${p.activa?'Activa':'Inactiva'}</span>
        </div>
        <div style="font-size:12px;color:rgba(26,26,24,.5)">${TIPO_LBL[p.tipo]||p.tipo} · ${ahorro}</div>
        ${p.aplica_a&&p.aplica_a!=='toda_la_tienda'?`<div style="font-size:11px;color:rgba(26,26,24,.4);margin-top:2px">${p.producto_especifico||p.aplica_a}</div>`:''}
      </div>
      <div style="display:flex;gap:6px;align-items:flex-start;flex-shrink:0">
        <button class="ad-btn ${p.en_carrusel?'ad-btn--verde':''}" data-carr-promo="${p.id}" data-carr="${p.en_carrusel}" style="font-size:12px" title="${p.en_carrusel?'Quitar del carrusel del landing':'Mostrar en el carrusel del landing (necesita foto)'}">${ic("image")}</button>
        <button class="ad-btn" data-ed-promo="${p.id}" style="font-size:12px">${ic("pencil")}</button>
        <button class="ad-btn" data-rm-promo="${p.id}" style="font-size:12px">${ic("trash-2")}</button>
      </div>
    </div>`;
  }).join(''):`<p style="text-align:center;padding:30px;color:rgba(26,26,24,.3)">No hay promociones aún.</p>`;
  return `${lista}<div class="ad-toolbar" style="margin-top:12px"><div class="ad-spacer"></div>
    <button class="ad-btn" id="promo-cerrar">Cerrar</button>
    <button class="ad-btn ad-btn--verde" id="promo-add" data-aliado-id="${aliadoId}">${ic("plus")} Nueva promoción</button></div>`;
}
function bindListaPromociones(aliadoId,aliadoNombre){
  setTimeout(()=>{
    $("#promo-cerrar")?.addEventListener('click',()=>window.cerrarModal?.());
    $("#promo-add")?.addEventListener('click',()=>{abrirModal('Nueva promoción',aliadoNombre,htmlFormPromocion({},aliadoId));bindFormPromocion(aliadoId,aliadoNombre,'');});
    document.querySelectorAll('[data-ed-promo]').forEach(btn=>{
      btn.addEventListener('click',()=>{const p=_promos.find(x=>x.id===btn.dataset.edPromo);if(p){abrirModal('Editar promoción',p.descripcion,htmlFormPromocion(p,aliadoId));bindFormPromocion(aliadoId,aliadoNombre,p.id);}});
    });
    document.querySelectorAll('[data-rm-promo]').forEach(btn=>{
      btn.addEventListener('click',async()=>{if(!confirm('¿Eliminar esta promoción?'))return;await supabase.from('promociones').delete().eq('id',btn.dataset.rmPromo);cargarYMostrarPromociones(aliadoId,aliadoNombre);toast('Promoción eliminada');});
    });
    document.querySelectorAll('[data-carr-promo]').forEach(btn=>{
      btn.addEventListener('click',async()=>{
        const activar=btn.dataset.carr!=='true';
        if(activar&&!_promos.find(x=>x.id===btn.dataset.carrPromo)?.foto_url){toast('Esta promoción necesita una foto antes de mostrarse en el carrusel');return;}
        await supabase.from('promociones').update({en_carrusel:activar}).eq('id',btn.dataset.carrPromo);
        cargarYMostrarPromociones(aliadoId,aliadoNombre);
      });
    });
    if(window.lucide)lucide.createIcons();
  },80);
}
function htmlFormPromocion(p={},aliadoId){

      <option value="2x1"${p.tipo==='2x1'?' selected':''}>2×1</option>
      <option value="regalo"${p.tipo==='regalo'?' selected':''}>Regalo / Cortesía</option>
      <option value="personalizado"${p.tipo==='personalizado'?' selected':''}>Personalizado</option>
    </select></div>
  <div class="ad-field"><label>Descripción *</label><textarea id="pr-desc" rows="2" placeholder="Ej: 20% de descuento en corte de cabello">${p.descripcion||''}</textarea></div>
  <div class="ad-field"><label>Aplica a</label>
    <select id="pr-aplica" style="${fldStyle}">
      <option value="toda_la_tienda"${!p.aplica_a||p.aplica_a==='toda_la_tienda'?' selected':''}>Toda la tienda</option>
      <option value="producto_especifico"${p.aplica_a==='producto_especifico'?' selected':''}>Producto / servicio específico</option>
    </select></div>
  <div class="ad-field" id="pr-prod-wrap" style="display:${p.aplica_a==='producto_especifico'?'block':'none'}">
    <label>Producto o servicio específico</label>
    <input id="pr-prod" type="text" value="${(p.producto_especifico||'').replace(/"/g,'&quot;')}" placeholder="Ej: Corte de cabello para hombre"></div>

  <div id="pr-calc-porcentaje" style="display:${p.tipo==='porcentaje'?'block':'none'}">
    <div class="ad-field-2">
      <div class="ad-field"><label>Precio normal ($) <span style="font-weight:400;color:rgba(26,26,24,.4)">(referencia)</span></label><input id="pr-precio-n-pct" type="number" min="0" value="${p.tipo==='porcentaje'?p.precio_normal||'':''}" placeholder="Ej: 50000"></div>
      <div class="ad-field"><label>Descuento (%)</label><input id="pr-pct" type="number" min="0" max="100" value="${pctVal}" placeholder="Ej: 20"></div>
    </div>
    <div id="pr-ahorro-pct-prev" style="font-size:13px;color:#1a7a3c;font-weight:600;margin:-4px 0 8px;min-height:18px"></div>
  </div>
  <div id="pr-calc-monto" style="display:${p.tipo==='monto_fijo'?'block':'none'}">
    <div class="ad-field"><label>Monto de descuento ($)</label><input id="pr-ahorro-fijo" type="number" min="0" value="${p.tipo==='monto_fijo'?p.ahorro_fijo||'':''}" placeholder="Ej: 5000"></div>
  </div>
  <div id="pr-calc-precio" style="display:${p.tipo==='precio_especial'?'block':'none'}">
    <div class="ad-field-2">
      <div class="ad-field"><label>Precio normal ($)</label><input id="pr-precio-n" type="number" min="0" value="${p.tipo==='precio_especial'?p.precio_normal||'':''}" placeholder="Ej: 80000"></div>
      <div class="ad-field"><label>Precio con descuento ($)</label><input id="pr-precio-d" type="number" min="0" value="${p.tipo==='precio_especial'?p.precio_descuento||'':''}" placeholder="Ej: 60000"></div>
    </div>
    <div id="pr-ahorro-prev" style="font-size:13px;color:#1a7a3c;font-weight:600;margin:-4px 0 8px;min-height:18px"></div>
  </div>
  <div id="pr-calc-regalo" style="display:${p.tipo==='regalo'?'block':'none'}">
    <div class="ad-field"><label>Valor del regalo ($) <span style="font-weight:400;color:rgba(26,26,24,.4)">(opcional)</span></label><input id="pr-regalo-val" type="number" min="0" value="${p.tipo==='regalo'?p.ahorro_fijo||'':''}" placeholder="Ej: 10000"></div>
  </div>
  <div id="pr-calc-variable" style="display:${['2x1','personalizado'].includes(p.tipo)?'block':'none'}">
    <p style="font-size:12px;color:rgba(26,26,24,.5);padding:10px 14px;background:#f5f4f0;border-radius:8px;margin-bottom:4px">El ahorro se registra al momento del uso del descuento.</p>
  </div>

  <hr style="border:none;border-top:1px solid rgba(26,26,24,.1);margin:14px 0 10px">
  <div class="ad-field"><label>Días en que aplica</label>
    <div style="display:flex;flex-wrap:wrap;gap:8px;margin-top:4px" id="pr-dias-chips">${diasChips}</div></div>

    <div class="ad-field"><label>Hora fin <span style="font-weight:400;color:rgba(26,26,24,.4)">(opcional)</span></label><input id="pr-hora-fin" type="time" value="${p.hora_fin||''}"></div>

    <div class="ad-field"><label>Vigencia desde <span style="font-weight:400;color:rgba(26,26,24,.4)">(opcional)</span></label><input id="pr-fecha-ini" type="date" value="${p.fecha_inicio||''}"></div>
    <div class="ad-field"><label>Vigencia hasta <span style="font-weight:400;color:rgba(26,26,24,.4)">(opcional)</span></label><input id="pr-fecha-fin" type="date" value="${p.fecha_fin||''}"></div>
  </div>
  <div class="ad-field-2">
    <div class="ad-field"><label>Compra mínima ($) <span style="font-weight:400;color:rgba(26,26,24,.4)">(opcional)</span></label><input id="pr-min" type="number" min="0" value="${p.monto_minimo||''}" placeholder="0"></div>
    <div class="ad-field"><label>Foto <span style="font-weight:400;color:rgba(26,26,24,.4)">(opcional)</span></label>
      ${p.foto_url?`<img src="${p.foto_url}" style="width:52px;height:52px;object-fit:cover;border-radius:8px;margin-bottom:6px;display:block">`:''}<input id="pr-foto" type="file" accept="image/*"><input type="hidden" id="pr-foto-url" value="${p.foto_url||''}"></div>
  </div>
  <label style="display:flex;align-items:center;gap:10px;cursor:pointer;font-size:13px;color:rgba(26,26,24,.6);margin-bottom:4px">
    <input id="pr-activa" type="checkbox" style="width:16px;height:16px;accent-color:#1f9d3c" ${p.activa===false?'':'checked'}>
    Promoción activa
  </label>
  <div class="ad-toolbar" style="margin:12px 0 0"><div class="ad-spacer"></div>
    <button class="ad-btn" id="pr-cancel">Cancelar</button>

}
function bindFormPromocion(aliadoId,aliadoNombre,editId){
  setTimeout(()=>{
    const CALC_KEYS=['porcentaje','monto','precio','regalo','variable'];
    const showCalc=(tipo)=>{
      CALC_KEYS.forEach(k=>{const el=$(`#pr-calc-${k}`);if(el)el.style.display='none';});
      if(tipo==='porcentaje')$("#pr-calc-porcentaje").style.display='block';
      else if(tipo==='monto_fijo')$("#pr-calc-monto").style.display='block';
      else if(tipo==='precio_especial')$("#pr-calc-precio").style.display='block';
      else if(tipo==='regalo')$("#pr-calc-regalo").style.display='block';
      else if(['2x1','personalizado'].includes(tipo))$("#pr-calc-variable").style.display='block';
    };
    $("#pr-tipo")?.addEventListener('change',(e)=>showCalc(e.target.value));
    $("#pr-aplica")?.addEventListener('change',(e)=>{const w=$("#pr-prod-wrap");if(w)w.style.display=e.target.value==='producto_especifico'?'block':'none';});
    const updPrecio=()=>{const n=parseInt($("#pr-precio-n")?.value)||0;const d=parseInt($("#pr-precio-d")?.value)||0;const el=$("#pr-ahorro-prev");if(el)el.textContent=n&&d&&n>d?`Ahorro: $${(n-d).toLocaleString('es-CO')} por visita`:'';};
    $("#pr-precio-n")?.addEventListener('input',updPrecio);
    $("#pr-precio-d")?.addEventListener('input',updPrecio);
    updPrecio();
    const updPct=()=>{const n=parseInt($("#pr-precio-n-pct")?.value)||0;const pct=parseInt($("#pr-pct")?.value)||0;const el=$("#pr-ahorro-pct-prev");if(el)el.textContent=n&&pct?`Ahorro: $${Math.round(n*pct/100).toLocaleString('es-CO')} por visita`:'';};
    $("#pr-precio-n-pct")?.addEventListener('input',updPct);
    $("#pr-pct")?.addEventListener('input',updPct);
    updPct();
    document.querySelectorAll('#pr-dias-chips .fa-chip').forEach(chip=>chip.addEventListener('click',()=>chip.classList.toggle('is-on')));
    $("#pr-cancel")?.addEventListener('click',()=>{cargarYMostrarPromociones(aliadoId,aliadoNombre);});
    const btn=$("#pr-save");
    btn?.addEventListener('click',async()=>{
      const tipo=$("#pr-tipo")?.value;
      const descripcion=$("#pr-desc")?.value.trim();
      if(!tipo){toast('Selecciona el tipo de promoción');return;}
      if(!descripcion){toast('La descripción es obligatoria');return;}
      btn.disabled=true;btn.innerHTML=`${ic("loader")} Guardando…`;if(window.lucide)lucide.createIcons();
      let precio_normal=null,precio_descuento=null,ahorro_fijo=null;
      if(tipo==='precio_especial'){
        precio_normal=parseInt($("#pr-precio-n")?.value)||null;
        precio_descuento=parseInt($("#pr-precio-d")?.value)||null;
        if(precio_normal&&precio_descuento)ahorro_fijo=precio_normal-precio_descuento;
      }else if(tipo==='porcentaje'){
        precio_normal=parseInt($("#pr-precio-n-pct")?.value)||null;
        const pct=parseInt($("#pr-pct")?.value)||0;
        if(precio_normal&&pct){precio_descuento=Math.round(precio_normal*(1-pct/100));ahorro_fijo=precio_normal-precio_descuento;}
      }else if(tipo==='monto_fijo'){
        ahorro_fijo=parseInt($("#pr-ahorro-fijo")?.value)||null;
      }else if(tipo==='regalo'){
        ahorro_fijo=parseInt($("#pr-regalo-val")?.value)||null;
      }
      const diasActivos=[...document.querySelectorAll('#pr-dias-chips .fa-chip.is-on')].map(b=>b.dataset.dia);
      let foto_url=$("#pr-foto-url")?.value||null;
      const file=$("#pr-foto")?.files?.[0];
      if(file)try{foto_url=await subirImagen(file);}catch(_){toast('Error al subir la foto');}
      const payload={aliado_id:aliadoId,tipo,descripcion,
        aplica_a:$("#pr-aplica")?.value||'toda_la_tienda',
        producto_especifico:$("#pr-aplica")?.value==='producto_especifico'?($("#pr-prod")?.value.trim()||null):null,
        precio_normal,precio_descuento,ahorro_fijo,
        dias_aplica:diasActivos.length?diasActivos:['lunes','martes','miercoles','jueves','viernes','sabado','domingo'],
        hora_inicio:$("#pr-hora-ini")?.value||null,
        hora_fin:$("#pr-hora-fin")?.value||null,
        fecha_inicio:$("#pr-fecha-ini")?.value||null,
        fecha_fin:$("#pr-fecha-fin")?.value||null,
        monto_minimo:parseInt($("#pr-min")?.value)||0,
        foto_url,activa:$("#pr-activa")?.checked!==false};
      const id=btn.dataset.id||editId;
      const{error}=id?await supabase.from('promociones').update(payload).eq('id',id):await supabase.from('promociones').insert(payload);
      if(error){toast('Error: '+error.message);btn.disabled=false;btn.innerHTML=`${ic("check")} ${id?'Guardar cambios':'Guardar promoción'}`;if(window.lucide)lucide.createIcons();return;}
      cargarYMostrarPromociones(aliadoId,aliadoNombre);
      toast(id?'Promoción actualizada ✓':'Promoción creada ✓');
    });
    if(window.lucide)lucide.createIcons();
  },80);
}

/* ---- OVERRIDES & DELEGACIÓN ---- */
document.addEventListener('DOMContentLoaded',async()=>{

  /* ---- AUTENTICACIÓN ---- */
  const loginScreen=document.getElementById('login-screen');
  const adminEl=document.getElementById('admin');
  function showAdmin(user){
    if(loginScreen)loginScreen.style.display='none';
    if(adminEl)adminEl.style.removeProperty('display');
    if(user?.email){
      const av=document.getElementById('side-av');const nm=document.getElementById('side-name');
      if(av)av.textContent=user.email[0].toUpperCase();
      if(nm)nm.textContent=user.email;
    }
    if(window.lucide)lucide.createIcons();
  }
  function showLoginScreen(msg){
    if(loginScreen)loginScreen.style.display='flex';
    if(adminEl)adminEl.style.display='none';
    if(msg){const errEl=document.getElementById('login-error');if(errEl){errEl.textContent=msg;errEl.style.display='block';}}
  }
  async function verificarYMostrarAdmin(user){
    if(!user){showLoginScreen();return;}
    const{data:perfil}=await supabase.from('perfiles').select('rol').eq('id',user.id).maybeSingle();
    if(perfil?.rol==='admin'){
      showAdmin(user);
    }else{
      await supabase.auth.signOut();
      showLoginScreen('Esta cuenta no tiene permisos de administrador.');
    }
  }
  const{data:{session:initSession}}=await supabase.auth.getSession();
  await verificarYMostrarAdmin(initSession?.user);
  supabase.auth.onAuthStateChange((_e,s)=>{verificarYMostrarAdmin(s?.user);});
  document.getElementById('login-btn')?.addEventListener('click',async()=>{
    const email=document.getElementById('login-email')?.value.trim();
    const pass=document.getElementById('login-pass')?.value;
    const errEl=document.getElementById('login-error');
    const btn=document.getElementById('login-btn');
    if(!email||!pass){if(errEl){errEl.textContent='Ingresa tu correo y contraseña.';errEl.style.display='block';}return;}
    btn.textContent='Ingresando…';btn.disabled=true;
    const{error}=await supabase.auth.signInWithPassword({email,password:pass});
    if(error){if(errEl){errEl.textContent='Correo o contraseña incorrectos.';errEl.style.display='block';}btn.textContent='Ingresar';btn.disabled=false;return;}
    if(errEl)errEl.style.display='none';
  });
  document.getElementById('login-pass')?.addEventListener('keydown',(e)=>{if(e.key==='Enter')document.getElementById('login-btn')?.click();});
  document.getElementById('btn-logout')?.addEventListener('click',async()=>{await supabase.auth.signOut();toast('Sesión cerrada');});
  /* ---- FIN AUTENTICACIÓN ---- */

  window.renderAliados=function(){
    $("#p-aliados").innerHTML=`<div class="ad-toolbar"><div class="ad-search-in"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg><input id="a-search" placeholder="Buscar aliado…" autocomplete="off"></div><div class="ad-spacer"></div><button class="ad-btn ad-btn--verde" id="a-add"><i data-lucide="plus"></i> Agregar aliado</button></div><div class="ad-table-wrap"><table class="ad-table"><thead><tr><th>Establecimiento</th><th>Categoría</th><th>Descuento</th><th>WhatsApp</th><th style="text-align:right">Estado</th></tr></thead><tbody id="a-body"><tr><td colspan="5" style="text-align:center;padding:30px;color:rgba(242,240,234,.3)">Cargando…</td></tr></tbody></table></div>`;
    cargarAliados();cargarPostulaciones();
  };
  window.abrirAgregarAliado=function(){abrirModal('Agregar aliado','Se publicará en el directorio',htmlFormAliado());bindFormAliado();};

  const COPc=(n)=>'$'+Number(n||0).toLocaleString('es-CO');
  function descargarCSV(nombreArchivo,headers,rows){
    const esc=v=>`"${String(v??'').replace(/"/g,'""')}"`;
    const csv=[headers.map(esc).join(','),...rows.map(r=>r.map(esc).join(','))].join('\r\n');
    const blob=new Blob(["﻿"+csv],{type:'text/csv;charset=utf-8;'});
    const url=URL.createObjectURL(blob);
    const a=document.createElement('a');
    a.href=url;a.download=nombreArchivo;document.body.appendChild(a);a.click();document.body.removeChild(a);
    URL.revokeObjectURL(url);
  }
  async function cargarContabilidad(){
    const hoy=new Date();
    if(!_contMes)_contMes=`${hoy.getFullYear()}-${String(hoy.getMonth()+1).padStart(2,'0')}`;
    const[{data:pagos},{data:gastos},{data:cats},{data:cfg},{data:pedidosCom},{data:ingMan},{data:catsIng}]=await Promise.all([
      supabase.from('pagos').select('id,monto,plan,referencia,created_at,perfiles(nombre)').order('created_at',{ascending:false}),
      supabase.from('gastos').select('id,monto,proveedor,fecha,nota,categoria_id,factura_url,categorias_gasto(nombre)').order('fecha',{ascending:false}),
      supabase.from('categorias_gasto').select('*').order('nombre'),
      supabase.from('config_contabilidad').select('*').eq('id',1).maybeSingle(),
      supabase.from('pedidos').select('id,monto,comision_valor,created_at,productos_aliado(nombre),aliados(nombre,tienda_nombre)').in('estado',['confirmado','entregado']).order('created_at',{ascending:false}),
      supabase.from('ingresos_manuales').select('id,monto,descripcion,fecha,nota,categoria_id,categorias_ingreso(nombre)').order('fecha',{ascending:false}),
      supabase.from('categorias_ingreso').select('*').order('nombre'),
    ]);
    _pagos=pagos||[];_gastos=gastos||[];_categoriasGasto=cats||[];
    _pedidosCom=pedidosCom||[];_ingresosManuales=ingMan||[];_categoriasIngreso=catsIng||[];
    if(cfg)_contConfig=cfg;
    renderContabilidadUI();
  }

    _contPagosMes=_pagos.filter(p=>enMes(p.created_at,_contMes));

    _contIngManMes=_ingresosManuales.filter(i=>enMes(i.fecha,_contMes));
    const totalIngresos=(pagosArr,comArr,manArr)=>pagosArr.reduce((s,p)=>s+(p.monto||0),0)+comArr.reduce((s,p)=>s+(p.comision_valor||0),0)+manArr.reduce((s,i)=>s+(i.monto||0),0);
    const gastosMesAnt=_gastos.filter(g=>enMes(g.fecha,mesAnt)).reduce((s,g)=>s+(g.monto||0),0);
    const ingresosMesAnt=totalIngresos(_pagos.filter(p=>enMes(p.created_at,mesAnt)),_pedidosCom.filter(p=>enMes(p.created_at,mesAnt)),_ingresosManuales.filter(i=>enMes(i.fecha,mesAnt)));
    const ingresosMes=totalIngresos(_contPagosMes,_contComisionMes,_contIngManMes);
    const gastosMes=_contGastosMes.reduce((s,g)=>s+(g.monto||0),0);
    const balanceMes=ingresosMes-gastosMes;
    const filasIngreso=[
      ..._contPagosMes.map(p=>({tipo:'membresia',concepto:'Membresía',detalle:p.perfiles?.nombre||'—',fecha:p.created_at,monto:p.monto})),

      ..._contIngManMes.map(i=>({tipo:'manual',concepto:i.categorias_ingreso?.nombre||'Otros',detalle:i.descripcion||'—',fecha:i.fecha,monto:i.monto,id:i.id,editable:true})),

    const pctChip=(actual,anterior)=>{if(!anterior)return{chip:'—',dir:'up'};const pct=Math.round((actual-anterior)/anterior*100);return{chip:(pct>=0?'+':'')+pct+'%',dir:pct>=0?'up':'down'};};
    const chIng=pctChip(ingresosMes,ingresosMesAnt),chGas=pctChip(gastosMes,gastosMesAnt);

    // Desglose de ingresos (IVA → ICA → fundadores → gastos → renta)

    const trasWompi=ingresosMes-wompiFeeMes;
    const ivaValor=trasWompi-(trasWompi/(1+cfg.iva_pct/100));
    const trasIva=trasWompi-ivaValor;
    const icaValor=trasIva*(cfg.ica_pct/100);
    const trasIca=trasIva-icaValor;
    const fundadoresValor=trasIca*(cfg.fundadores_pct/100);
    const trasFundadores=trasIca-fundadoresValor;
    const trasGastos=trasFundadores-gastosMes;
    const rentaValor=Math.max(0,trasGastos)*(cfg.renta_pct/100);
    const utilidadNeta=trasGastos-rentaValor;

    const ingresosAnio=totalIngresos(
      _pagos.filter(p=>new Date(p.created_at).getFullYear()===y),
      _pedidosCom.filter(p=>new Date(p.created_at).getFullYear()===y),
      _ingresosManuales.filter(i=>new Date(i.fecha).getFullYear()===y)
    );
    const gastosAnio=_gastos.filter(g=>new Date(g.fecha).getFullYear()===y).reduce((s,g)=>s+(g.monto||0),0);

    $("#p-contabilidad").innerHTML=`

              <td style="text-align:right"><span class="ad-num-strong">${COPc(g.monto)}</span></td>
              <td style="text-align:right"><div style="display:flex;gap:6px;justify-content:flex-end"><button class="ad-btn" data-ed-gasto="${g.id}">${ic('pencil')}</button><button class="ad-btn" data-rm-gasto="${g.id}">${ic('trash-2')}</button></div></td>
            </tr>`).join(''):`<tr><td colspan="5" style="text-align:center;padding:30px;color:rgba(242,240,234,.3)">No hay gastos registrados este mes</td></tr>`}
          </tbody>

  function bindFormGasto(g={}){
    setTimeout(()=>{
      $("#gf-categoria")?.addEventListener('change',(e)=>{const n=$("#gf-categoria-nueva");if(n)n.style.display=e.target.value==='__nueva__'?'block':'none';});

      $("#gf-save")?.addEventListener('click',async()=>{
        const btn=$("#gf-save");const id=btn.dataset.id;
        const resetBtn=()=>{btn.disabled=false;btn.innerHTML=`${ic("check")} ${id?'Guardar cambios':'Agregar gasto'}`;if(window.lucide)lucide.createIcons();};
        let categoriaId=$("#gf-categoria")?.value;
        const nuevaCat=$("#gf-categoria-nueva")?.value.trim();
        const proveedor=$("#gf-proveedor")?.value.trim();
        const monto=valorMoneda($("#gf-monto"));
        const fecha=$("#gf-fecha")?.value;
        const nota=$("#gf-nota")?.value.trim()||null;
        if(!monto){toast('Ingresa un monto válido');return;}
        if(!fecha){toast('Selecciona una fecha');return;}
        btn.disabled=true;btn.innerHTML=`${ic("loader")} Guardando…`;if(window.lucide)lucide.createIcons();
        if(categoriaId==='__nueva__'){
          if(!nuevaCat){toast('Escribe el nombre de la categoría nueva');resetBtn();return;}
          const{data:catData,error:catErr}=await supabase.from('categorias_gasto').insert({nombre:nuevaCat}).select().single();
          if(catErr){toast('Error creando categoría: '+catErr.message);resetBtn();return;}
          categoriaId=catData.id;
        }
        let facturaUrl=$("#gf-factura-url")?.value||null;
        const facturaFile=$("#gf-factura")?.files?.[0];
        if(facturaFile){
          try{facturaUrl=await subirImagen(facturaFile);}
          catch(_){toast('Error subiendo la factura');resetBtn();return;}
        }
        const payload={categoria_id:categoriaId||null,proveedor:proveedor||null,monto,fecha,nota,factura_url:facturaUrl};
        const{error}=id?await supabase.from('gastos').update(payload).eq('id',id):await supabase.from('gastos').insert(payload);
        if(error){toast('Error: '+error.message);resetBtn();return;}
        window.cerrarModal?.();
        toast(id?'Gasto actualizado ✓':'Gasto agregado ✓');
        cargarContabilidad();
      });
    },0);
  }

  let _prodalPendientes=[];
  async function cargarTiendasAliados(){
    const[{data:pend},{data:tiendas}]=await Promise.all([
      supabase.from('productos_aliado').select('*,aliados(nombre,tienda_nombre)').eq('estado','pendiente').order('created_at',{ascending:true}),
      supabase.from('aliados').select('id,nombre,tienda_nombre').eq('tienda_activa',true).order('tienda_nombre'),
    ]);
    _prodalPendientes=pend||[];
    const pendBody=$('#prodal-pend-body');
    if(pendBody){
      pendBody.innerHTML=!_prodalPendientes.length
        ?`<tr><td colspan="4" style="text-align:center;padding:30px;color:rgba(242,240,234,.3)">No hay productos pendientes de aprobación</td></tr>`
        :_prodalPendientes.map(p=>`<tr>
            <td><div class="ad-cell-user">
              ${p.imagen_url?`<img src="${p.imagen_url}" style="width:40px;height:40px;object-fit:cover;border-radius:8px;flex-shrink:0">`:`<span class="ad-av">${esc((p.nombre||'?')[0])}</span>`}
              <div class="ad-cell-user__name">${esc(p.nombre)}</div>
            </div></td>
            <td style="font-size:12px">${esc(p.aliados?.tienda_nombre||p.aliados?.nombre)||'—'}</td>
            <td style="font-size:13px;font-weight:700">${COP(p.precio_descuento||p.precio_normal)}</td>
            <td style="text-align:right"><div style="display:flex;gap:8px;justify-content:flex-end">
              <button class="ad-btn ad-btn--verde" data-aprobar-prodal="${p.id}">${ic('check')} Aprobar</button>
              <button class="ad-btn" data-rechazar-prodal="${p.id}">${ic('x')} Rechazar</button>
            </div></td>
          </tr>`).join('');
    }
    const tiendasBody=$('#tiendas-aliados-body');
    if(tiendasBody){
      if(!tiendas?.length){
        tiendasBody.innerHTML=`<tr><td colspan="6" style="text-align:center;padding:30px;color:rgba(242,240,234,.3)">Ningún aliado ha activado su tienda todavía</td></tr>`;
      }else{
        const[{data:aprobados},{data:pedidos}]=await Promise.all([
          supabase.from('productos_aliado').select('aliado_id').eq('estado','aprobado'),
          supabase.from('pedidos').select('aliado_id,monto,comision_valor,estado'),
        ]);
        const countAprobados=(id)=>(aprobados||[]).filter(x=>x.aliado_id===id).length;
        const pedidosDe=(id)=>(pedidos||[]).filter(x=>x.aliado_id===id);
        const confirmadosDe=(id)=>pedidosDe(id).filter(x=>x.estado==='confirmado'||x.estado==='entregado');
        tiendasBody.innerHTML=tiendas.map(t=>{
          const conf=confirmadosDe(t.id);
          const ventas=conf.reduce((s,p)=>s+(p.monto||0),0);
          const comision=conf.reduce((s,p)=>s+(p.comision_valor||0),0);
          return `<tr data-ver-tienda="${t.id}" data-nom-tienda="${esc(t.tienda_nombre||t.nombre)}" style="cursor:pointer">
          <td>${esc(t.tienda_nombre||t.nombre)}</td>
          <td style="font-size:12px">${esc(t.nombre)}</td>
          <td>${countAprobados(t.id)}</td>
          <td>${pedidosDe(t.id).length}</td>
          <td>${COP(ventas)}</td>
          <td style="text-align:right"><span class="ad-num-strong">${COP(comision)}</span></td>
        </tr>`;
        }).join('');
      }
    }
    if(window.lucide)lucide.createIcons();
  }

    if(e.target.closest('#prod-add')){abrirModal('Agregar producto','Aparecerá en la tienda del Club',htmlFormProd());bindFormProd();return;}
    const edProd=e.target.closest('[data-ed-prod]');if(edProd){const p=_prods.find(x=>x.id===edProd.dataset.edProd);if(p){abrirModal('Editar producto',p.nombre,htmlFormProd(p));bindFormProd();}return;}
    const togProd=e.target.closest('[data-tog-prod]');if(togProd){await supabase.from('productos').update({activo:togProd.dataset.activo!=='true'}).eq('id',togProd.dataset.togProd);cargarTiendaAdmin();return;}
    const rmProd=e.target.closest('[data-rm-prod]');if(rmProd&&confirm('¿Eliminar este producto?')){await supabase.from('productos').delete().eq('id',rmProd.dataset.rmProd);cargarTiendaAdmin();toast('Producto eliminado');return;}

    const togM=e.target.closest('[data-tog-marca]'); if(togM){ await supabase.from('marcas_aliadas').update({activa: togM.dataset.activa!=='true'}).eq('id',togM.dataset.togMarca); cargarMarcasAdmin(); return; }
    const rmM=e.target.closest('[data-rm-marca]'); if(rmM&&confirm('¿Eliminar esta marca?')){ await supabase.from('marcas_aliadas').delete().eq('id',rmM.dataset.rmMarca); cargarMarcasAdmin(); toast('Marca eliminada'); return; }
    const upM=e.target.closest('[data-marca-up]'); if(upM){ const m=_marcas.find(x=>x.id===upM.dataset.marcaUp); if(m&&m.orden>0){ await supabase.from('marcas_aliadas').update({orden:m.orden-1}).eq('id',m.id); cargarMarcasAdmin(); } return; }
    const dnM=e.target.closest('[data-marca-dn]'); if(dnM){ const m=_marcas.find(x=>x.id===dnM.dataset.marcaDn); if(m){ await supabase.from('marcas_aliadas').update({orden:m.orden+1}).eq('id',m.id); cargarMarcasAdmin(); } return; }

    if(e.target.closest('#btn-an-add')){abrirModal('Nuevo anuncio','Publica una novedad',htmlFormAnuncio());bindFormAnuncio();return;}
    const edAn=e.target.closest('[data-ed-an]');if(edAn){const a=_anuncios.find(x=>x.id===edAn.dataset.edAn);if(a){abrirModal('Editar anuncio',a.titulo,htmlFormAnuncio(a));bindFormAnuncio();}return;}
    const rmAn=e.target.closest('[data-rm-an]');if(rmAn&&confirm('¿Eliminar este anuncio?')){await supabase.from('anuncios').delete().eq('id',rmAn.dataset.rmAn);cargarAnuncios();toast('Anuncio eliminado');return;}
    if(e.target.closest('#btn-prog-add')){abrirModal('Nuevo programa','Se publicará en la web',htmlFormProg());bindFormProg();return;}
    const edProg=e.target.closest('[data-ed-prog]');if(edProg){const p=_programas.find(x=>x.id===edProg.dataset.edProg);if(p){abrirModal('Editar programa',p.nombre,htmlFormProg(p));bindFormProg();}return;}
    const togProg=e.target.closest('[data-tog-prog]');if(togProg){const activo=togProg.dataset.activo==='true';await supabase.from('programas').update({activo:!activo}).eq('id',togProg.dataset.togProg);cargarProgramas();return;}
    const rmProg=e.target.closest('[data-rm-prog]');if(rmProg&&confirm('¿Eliminar este programa?')){await supabase.from('programas').delete().eq('id',rmProg.dataset.rmProg);cargarProgramas();toast('Programa eliminado');return;}
    if(e.target.closest('#btn-prof-add')){abrirModal('Agregar profesional','Se publicará en el directorio',htmlFormProf());bindFormProf();return;}
    const aprobarProf=e.target.closest('[data-aprobar-prof]');if(aprobarProf){const id=aprobarProf.dataset.aprobarProf;const waUrl=aprobarProf.dataset.waProf;await supabase.from('profesionales').update({estado:'aprobado'}).eq('id',id);if(waUrl)window.open(waUrl,'_blank');cargarProfesionales();toast('Profesional aprobado — notificando por WhatsApp…');return;}
    const activarProf=e.target.closest('[data-activar-prof]');if(activarProf){await supabase.from('profesionales').update({estado:'activo',activo:true}).eq('id',activarProf.dataset.activarProf);cargarProfesionales();toast('Profesional activado ✓');return;}
    const desactivarProf=e.target.closest('[data-desactivar-prof]');if(desactivarProf){await supabase.from('profesionales').update({estado:'pendiente',activo:false}).eq('id',desactivarProf.dataset.desactivarProf);cargarProfesionales();toast('Profesional desactivado');return;}
    const aprobarPost=e.target.closest('[data-aprobar-post]');if(aprobarPost){const id=aprobarPost.dataset.aprobarPost;const waUrl=aprobarPost.dataset.waPost;const nombre=aprobarPost.dataset.nomPost;const categoria=aprobarPost.dataset.catPost;const whatsapp=aprobarPost.dataset.telPost;await supabase.from('aliados').insert({nombre,categoria,whatsapp,activo:false});await supabase.from('aliados_postulaciones').update({estado:'aprobado'}).eq('id',id);if(waUrl)window.open(waUrl,'_blank');window.renderAliados?.();toast('Aliado aprobado — notificando por WhatsApp…');return;}
    const rechazarPost=e.target.closest('[data-rechazar-post]');if(rechazarPost&&confirm('¿Rechazar esta postulación?')){await supabase.from('aliados_postulaciones').update({estado:'rechazado'}).eq('id',rechazarPost.dataset.rechazarPost);window.renderAliados?.();toast('Postulación rechazada');return;}

    const togProf=e.target.closest('[data-tog-prof]');if(togProf){const activo=togProf.dataset.activo==='true';await supabase.from('profesionales').update({activo:!activo}).eq('id',togProf.dataset.togProf);cargarProfesionales();return;}
    const rmProf=e.target.closest('[data-rm-prof]');if(rmProf&&confirm('¿Eliminar este profesional?')){await supabase.from('profesionales').delete().eq('id',rmProf.dataset.rmProf);cargarProfesionales();toast('Profesional eliminado');return;}

    const destAl=e.target.closest('[data-dest-aliado]');if(destAl){await supabase.from('aliados').update({destacado:destAl.dataset.dest!=='true'}).eq('id',destAl.dataset.destAliado);cargarAliados();return;}
    const edAl=e.target.closest('[data-ed-aliado]');if(edAl){const a=_aliados.find(x=>x.id===edAl.dataset.edAliado);if(a){abrirModal('Editar aliado',a.nombre,htmlFormAliado(a));bindFormAliado();}return;}
    const togAl=e.target.closest('[data-tog-aliado]');if(togAl){const activo=togAl.dataset.activo==='true';await supabase.from('aliados').update({activo:!activo}).eq('id',togAl.dataset.togAliado);cargarAliados();return;}
    const rmAl=e.target.closest('[data-rm-aliado]');if(rmAl&&confirm('¿Eliminar este aliado?')){await supabase.from('aliados').delete().eq('id',rmAl.dataset.rmAliado);cargarAliados();toast('Aliado eliminado');return;}
    const edPlan=e.target.closest('[data-ed-plan]');if(edPlan){const p=_planes.find(x=>x.slug===edPlan.dataset.edPlan);if(p){abrirModal('Editar plan',p.tag,htmlFormPlan(p));bindFormPlan();}return;}
    if(e.target.closest('#gasto-add')){abrirModal('Agregar gasto','Registro manual de un gasto del Club',htmlFormGasto());bindFormGasto();return;}
    const edGasto=e.target.closest('[data-ed-gasto]');if(edGasto){const g=_gastos.find(x=>x.id===edGasto.dataset.edGasto);if(g){abrirModal('Editar gasto',g.proveedor||'Gasto',htmlFormGasto(g));bindFormGasto(g);}return;}
    const rmGasto=e.target.closest('[data-rm-gasto]');if(rmGasto&&confirm('¿Eliminar este gasto?')){await supabase.from('gastos').delete().eq('id',rmGasto.dataset.rmGasto);cargarContabilidad();toast('Gasto eliminado');return;}
    if(e.target.closest('#gastos-csv')){descargarCSV(`gastos-${_contMes}.csv`,['Proveedor','Categoría','Fecha','Monto','Nota'],_contGastosMes.map(g=>[g.proveedor||'',g.categorias_gasto?.nombre||'',g.fecha,g.monto,g.nota||'']));return;}
    if(e.target.closest('#ingresos-csv')){const filas=_contFiltroIngreso&&_contFiltroIngreso!=='todos'?_contFilasIngreso.filter(f=>f.tipo===_contFiltroIngreso):_contFilasIngreso;descargarCSV(`ingresos-${_contMes}.csv`,['Concepto','Detalle','Fecha','Monto'],filas.map(f=>[f.concepto,f.detalle,f.fecha,f.monto]));return;}
    if(e.target.closest('#ingreso-add')){abrirModal('Agregar ingreso','Registro manual de un ingreso del Club',htmlFormIngreso());bindFormIngreso();return;}
    const edIngreso=e.target.closest('[data-ed-ingreso]');if(edIngreso){const i=_ingresosManuales.find(x=>x.id===edIngreso.dataset.edIngreso);if(i){abrirModal('Editar ingreso',i.descripcion||'Ingreso',htmlFormIngreso(i));bindFormIngreso(i);}return;}
    const rmIngreso=e.target.closest('[data-rm-ingreso]');if(rmIngreso&&confirm('¿Eliminar este ingreso?')){await supabase.from('ingresos_manuales').delete().eq('id',rmIngreso.dataset.rmIngreso);cargarContabilidad();toast('Ingreso eliminado');return;}
    const verTienda=e.target.closest('[data-ver-tienda]');if(verTienda&&!e.target.closest('a')){verDetalleTienda(verTienda.dataset.verTienda,verTienda.dataset.nomTienda);return;}
    const aprobarProdal=e.target.closest('[data-aprobar-prodal]');if(aprobarProdal){await supabase.from('productos_aliado').update({estado:'aprobado'}).eq('id',aprobarProdal.dataset.aprobarProdal);window.cargarTiendasAliados?.();toast('Producto aprobado ✓');return;}
    const rechazarProdal=e.target.closest('[data-rechazar-prodal]');if(rechazarProdal&&confirm('¿Rechazar este producto?')){await supabase.from('productos_aliado').update({estado:'rechazado'}).eq('id',rechazarProdal.dataset.rechazarProdal);window.cargarTiendasAliados?.();toast('Producto rechazado');return;}
