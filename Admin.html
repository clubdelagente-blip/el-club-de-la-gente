    body { background: #0A0A0A; }

  <script type="module">
/* ---- ADMIN CMS — inline para evitar caché ---- */
import { createClient } from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm';

const supabase = createClient(
  "https://egwaedadpqfwnbfosiao.supabase.co",
  "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImVnd2FlZGFkcHFmd25iZm9zaWFvIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODA3Njc2ODcsImV4cCI6MjA5NjM0MzY4N30.NrBPX8HhTcs_y-QG3o_GoEAednFc0TqUunkQe1dblT4"
);
const $ = (s) => document.querySelector(s);
const ic = (n) => `<i data-lucide="${n}"></i>`;
// Cliente aislado (sin persistir sesión) para crear cuentas de aliados desde
// el Admin sin reemplazar la sesión del administrador logueado -- signUp()
// en el cliente principal movería la sesión activa a la cuenta recién creada.
function clienteAislado(){
  return createClient(
    "https://egwaedadpqfwnbfosiao.supabase.co",
    "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImVnd2FlZGFkcHFmd25iZm9zaWFvIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODA3Njc2ODcsImV4cCI6MjA5NjM0MzY4N30.NrBPX8HhTcs_y-QG3o_GoEAednFc0TqUunkQe1dblT4",

let _aliados=[], _anuncios=[], _programas=[], _profesionales=[], _gastos=[], _categoriasGasto=[], _pagos=[], _contMes=null, _contGastosMes=[], _contPagosMes=[], _contConfig={iva_pct:19,ica_pct:0.92,fundadores_pct:40,renta_pct:35,comision_tienda_pct:10};
let _pedidosCom=[], _ingresosManuales=[], _categoriasIngreso=[], _contComisionMes=[], _contIngManMes=[], _contFilasIngreso=[], _contFiltroIngreso=null;

const CATS=['Restaurante / Cafetería','Salud y bienestar','Belleza y estética','Barbería','Odontología','Veterinaria','Ropa y accesorios','Supermercado / Tienda','Educación','Deporte y gym','Tecnología'];
const PLANES_VIS=[{val:'gratis',lbl:'Gratis'},{val:'basica',lbl:'Básica'},{val:'premium',lbl:'Premium'}];

function toast(msg){const t=$("#ad-toast");if(!t)return;t.textContent=msg;t.classList.add("is-show");setTimeout(()=>t.classList.remove("is-show"),3000);}
// Campos de dinero: texto con separador de miles en vivo (un <input type="number"> interpreta
// el "." que la gente escribe para miles como punto decimal, ej. "62.000" -> 62).
function formatearInputMoneda(input){
  if(!input)return;
  input.addEventListener('input',()=>{
    const digits=input.value.replace(/\D/g,'');
    input.value=digits?Number(digits).toLocaleString('es-CO'):'';
  });
}
function valorMoneda(input){return parseInt((input?.value||'').replace(/\D/g,''))||0;}
function abrirModal(t,s,b){$("#modal-title").textContent=t;$("#modal-sub").textContent=s;$("#modal-body").innerHTML=b;$("#ad-modal-ov").classList.add("is-open");if(window.lucide)lucide.createIcons();}
async function subirImagen(file){const ext=file.name.split('.').pop();const path=`${Date.now()}-${Math.random().toString(36).substr(2,5)}.${ext}`;const{error}=await supabase.storage.from('contenido').upload(path,file);if(error)throw error;return supabase.storage.from('contenido').getPublicUrl(path).data.publicUrl;}

/* ---- ALIADOS ---- */
async function cargarAliados(){
  const{data}=await supabase.from('aliados').select('*').order('created_at',{ascending:false});
  _aliados=data||[];
  const tbody=$("#a-body");if(!tbody)return;
  if(!_aliados.length){tbody.innerHTML=`<tr><td colspan="5" style="text-align:center;padding:40px;color:rgba(242,240,234,.3)">Aún no hay aliados →</td></tr>`;return;}
  tbody.innerHTML=_aliados.map(a=>`<tr>
    <td><div class="ad-cell-user">${a.imagen_url?`<img src="${a.imagen_url}" style="width:36px;height:36px;object-fit:cover;border-radius:6px;flex-shrink:0">`:`<span class="ad-av">${(a.nombre||'?')[0]}</span>`}<div class="ad-cell-user__name">${a.nombre}</div></div></td>
    <td><span class="ad-table__num">${a.categoria||'—'}</span><br><span style="font-size:10px;color:rgba(242,240,234,.35)">${PLANES_VIS.filter(p=>(a.planes_visibles||['basica','premium']).includes(p.val)).map(p=>p.lbl).join(' · ')||'Sin plan asignado'}</span></td>
    <td><span class="ad-num-strong verde">${a.descuento||'—'}</span></td>
    <td>${a.whatsapp||'—'}</td>
    <td style="text-align:right"><div style="display:flex;gap:8px;justify-content:flex-end;align-items:center">
      <button class="ad-btn ${a.destacado?'ad-btn--verde':''}" data-dest-aliado="${a.id}" data-dest="${a.destacado}" title="${a.destacado?'Quitar destacado':'Marcar como destacado'}" style="padding:4px 10px">${ic("star")}</button>
      <span class="ad-pill ${a.activo?'activo':'inactivo'}" data-tog-aliado="${a.id}" data-activo="${a.activo}" style="cursor:pointer"><span class="d"></span>${a.activo?'Activo':'Inactivo'}</span>
      <button class="ad-btn" data-promos-aliado="${a.id}" data-nom-aliado="${(a.nombre||'').replace(/"/g,'&quot;')}" title="Promociones">${ic("tag")}</button>
      <button class="ad-btn" data-ed-aliado="${a.id}">${ic("pencil")}</button>
      <button class="ad-btn" data-rm-aliado="${a.id}">${ic("trash-2")}</button>
    </div></td></tr>`).join('');
  if(window.lucide)lucide.createIcons();
}
async function cargarPostulaciones(){
  const{data}=await supabase.from('aliados_postulaciones').select('*').eq('estado','pendiente').order('created_at',{ascending:false});
  const post=data||[];const panel=$("#p-aliados");if(!panel||!post.length)return;
  const tableWrap=panel.querySelector('.ad-table-wrap');if(!tableWrap)return;
  const html=`<div id="postulaciones-wrap" style="margin-bottom:20px">
    <div style="font-size:12px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:rgba(242,240,234,.35);margin-bottom:10px">Postulaciones pendientes (${post.length})</div>
    ${post.map(p=>{
      const wa=(p.whatsapp||'').replace(/\D/g,'');
      const msg=encodeURIComponent(`Hola ${p.nombre_responsable||''},\n\nLa postulación de *${p.nombre_negocio||'tu negocio'}* en El Club de la Gente fue aprobada ✅\n\nPara activar tu perfil de aliado y aparecer en el directorio, realiza el pago de membresía mensual ($20.000 COP) aquí:\n\n[Agrega el link de pago aquí]\n\n¡Bienvenido al Club!\nEl equipo de El Club de la Gente`);
      const waUrl=wa?`https://wa.me/57${wa}?text=${msg}`:'';
      return `<div style="display:flex;gap:12px;padding:14px;background:rgba(245,158,11,.06);border:1px solid rgba(245,158,11,.2);border-radius:10px;margin-bottom:8px">
        <div style="flex:1;min-width:0">
          <div style="font-weight:600;margin-bottom:2px">${p.nombre_negocio||'(sin nombre)'}</div>
          <div style="font-size:12px;color:rgba(242,240,234,.4)">${p.categoria||''} · ${p.nombre_responsable||''} · ${p.whatsapp||''}</div>
        </div>
        <div style="display:flex;gap:6px;align-items:center;flex-shrink:0">
          <span style="font-size:11px;font-weight:600;padding:3px 10px;border-radius:20px;background:rgba(245,158,11,.15);color:#f59e0b;border:1px solid rgba(245,158,11,.3)">Pendiente</span>
          ${waUrl?`<button class="ad-btn ad-btn--verde" data-aprobar-post="${p.id}" data-wa-post="${waUrl}" data-nom-post="${(p.nombre_negocio||'').replace(/"/g,'&quot;')}" data-cat-post="${(p.categoria||'').replace(/"/g,'&quot;')}" data-tel-post="${(p.whatsapp||'').replace(/"/g,'&quot;')}" style="font-size:12px">${ic('message-circle')} Aprobar&nbsp;+ WA</button>`:`<span style="font-size:11px;color:rgba(242,240,234,.3)">Sin WhatsApp</span>`}
          <button class="ad-btn" data-rechazar-post="${p.id}" style="font-size:12px" title="Rechazar">${ic('x')}</button>
        </div>
      </div>`;
    }).join('')}
    <hr style="border:none;border-top:1px solid rgba(242,240,234,.08);margin:16px 0 0">
  </div>`;
  tableWrap.insertAdjacentHTML('beforebegin',html);
  if(window.lucide)lucide.createIcons();
}
function htmlFormAliado(a={}){
  const sel=(a.categoria||'').split(',').map(s=>s.trim()).filter(Boolean);
  const chips=CATS.map(c=>`<button type="button" class="fa-chip${sel.includes(c)?' is-on':''}" data-cat="${c}">${c}</button>`).join('');
  const personalizadas=sel.filter(c=>!CATS.includes(c));

function actualizarCatHidden(){
  const fijas=[...document.querySelectorAll('#fa-chips .fa-chip.is-on')].map(b=>b.dataset.cat);
  const personalizadas=[...document.querySelectorAll('#fa-chips-custom .fa-chip')].map(b=>b.dataset.cat);
  const h=$("#fa-cat");if(h)h.value=[...fijas,...personalizadas].join(', ');
}
function bindFormAliado(){
  setTimeout(()=>{
    document.querySelectorAll('#fa-chips .fa-chip').forEach(chip=>{
      chip.addEventListener('click',()=>{
        chip.classList.toggle('is-on');
        actualizarCatHidden();
      });
    });
    const bindChipPersonalizada=(chip)=>{
      chip.addEventListener('click',()=>{ chip.remove(); actualizarCatHidden(); });
    };
    document.querySelectorAll('#fa-chips-custom .fa-chip').forEach(bindChipPersonalizada);
    const agregarCategoriaPersonalizada=()=>{
      const input=$("#fa-cat-nueva");
      const val=input?.value.trim();
      if(!val)return;
      const yaExiste=[...document.querySelectorAll('#fa-chips .fa-chip, #fa-chips-custom .fa-chip')]
        .some(b=>(b.dataset.cat||'').toLowerCase()===val.toLowerCase());
      if(yaExiste){toast('Esa categoría ya está agregada');input.value='';return;}
      const chip=document.createElement('button');
      chip.type='button';chip.className='fa-chip is-on';chip.dataset.cat=val;chip.dataset.custom='1';
      chip.innerHTML=`${val} &times;`;
      bindChipPersonalizada(chip);
      $("#fa-chips-custom")?.appendChild(chip);
      input.value='';
      actualizarCatHidden();
    };
    $("#fa-cat-add")?.addEventListener('click',agregarCategoriaPersonalizada);
    $("#fa-cat-nueva")?.addEventListener('keydown',(e)=>{if(e.key==='Enter'){e.preventDefault();agregarCategoriaPersonalizada();}});
    $("#fa-codigo-gen")?.addEventListener('click',()=>{
      const input=$("#fa-codigo");if(input)input.value=String(Math.floor(1000+Math.random()*9000));
    });
    $("#fa-crear-cuenta")?.addEventListener('click',async()=>{
      const btn=$("#fa-crear-cuenta");
      const aliadoId=$("#fa-save")?.dataset.id;
      const email=$("#fa-cuenta-email")?.value.trim();
      const nombre=$("#fa-nombre")?.value.trim();
      const whatsapp=$("#fa-wa")?.value.trim();
      if(!aliadoId){toast('Guarda el aliado primero');return;}
      if(!email){toast('Escribe un email para la cuenta');return;}
      btn.disabled=true;btn.innerHTML=`${ic("loader")} Creando…`;if(window.lucide)lucide.createIcons();

      const password=Array.from(crypto.getRandomValues(new Uint8Array(6))).map(b=>b.toString(16).padStart(2,'0')).join('');
      const aislado=clienteAislado();
      const{data,error}=await aislado.auth.signUp({email,password,options:{data:{nombre,rol:'aliado'}}});

      if(error||!data?.user){
        toast('Error creando la cuenta: '+(error?.message||'desconocido'));
        btn.disabled=false;btn.innerHTML=`${ic("key")} Crear cuenta de acceso`;if(window.lucide)lucide.createIcons();
        return;
      }

      await supabase.from('aliados').update({user_id:data.user.id}).eq('id',aliadoId);
      await supabase.from('perfiles').upsert({id:data.user.id,nombre,whatsapp:whatsapp||null,rol:'aliado'});

      const a=_aliados.find(x=>x.id===aliadoId);
      abrirModal('Cuenta creada ✓',nombre,`
        <p style="font-size:13px;color:rgba(242,240,234,.6);margin-bottom:16px">Comparte estos datos con el aliado (por el canal que prefieras). No se van a volver a mostrar.</p>
        <div class="ad-field"><label>Email</label><input type="text" readonly value="${email}" id="fa-cred-email"></div>
        <div class="ad-field"><label>Contraseña</label><input type="text" readonly value="${password}" id="fa-cred-pass"></div>
        <button type="button" class="ad-btn" id="fa-cred-copiar" style="margin-bottom:16px">${ic("copy")} Copiar email y contraseña</button>
        <div class="ad-toolbar" style="margin:0"><div class="ad-spacer"></div>
          <button class="ad-btn ad-btn--verde" id="fa-cred-listo">${ic("check")} Listo</button>
        </div>
      `);
      if(window.lucide)lucide.createIcons();
      $("#fa-cred-copiar")?.addEventListener('click',async()=>{
        await navigator.clipboard.writeText(`Email: ${email}\nContraseña: ${password}`).catch(()=>{});
        toast('Copiado ✓');
      });
      $("#fa-cred-listo")?.addEventListener('click',()=>{
        if(a){abrirModal('Editar aliado',a.nombre,htmlFormAliado({...a,user_id:data.user.id}));bindFormAliado();}
        else window.cerrarModal?.();
      });
    });
    document.querySelectorAll('#fa-planes-chips .fa-chip').forEach(chip=>{
      chip.addEventListener('click',()=>{
        chip.classList.toggle('is-on');
        const sel=[...document.querySelectorAll('#fa-planes-chips .fa-chip.is-on')].map(b=>b.dataset.planVis);
        const h=$("#fa-planes");if(h)h.value=sel.join(',');
      });
    });
    $("#fa-cancel")?.addEventListener('click',()=>window.cerrarModal?.());
    const btn=$("#fa-save");
    btn?.addEventListener('click',async()=>{
      const nombre=$("#fa-nombre")?.value.trim();
      if(!nombre){toast('El nombre es obligatorio');return;}
      btn.disabled=true;btn.innerHTML=`${ic("loader")} Guardando…`;if(window.lucide)lucide.createIcons();
      let imagen_url=$("#fa-img-url")?.value||null;
      const file=$("#fa-img")?.files?.[0];
      if(file)try{imagen_url=await subirImagen(file);}catch(_){toast('Error al subir imagen');}
      const planesSel=$("#fa-planes")?.value.split(',').map(s=>s.trim()).filter(Boolean);
      const payload={nombre,categoria:$("#fa-cat")?.value.trim()||null,descripcion:$("#fa-desc")?.value.trim()||null,whatsapp:$("#fa-wa")?.value.trim()||null,direccion:$("#fa-dir")?.value.trim()||null,maps_url:$("#fa-maps")?.value.trim()||null,codigo_aliado:$("#fa-codigo")?.value.trim()||null,imagen_url,planes_visibles:planesSel?.length?planesSel:['basica','premium'],activo:true};
      const id=btn.dataset.id;
      const{error}=id?await supabase.from('aliados').update(payload).eq('id',id):await supabase.from('aliados').insert(payload);
      if(error){toast('Error: '+error.message);btn.disabled=false;return;}
      window.cerrarModal?.();cargarAliados();toast(id?'Aliado actualizado ✓':'Aliado agregado ✓');
    });
    const aliadoId=btn?.dataset?.id;
    if(aliadoId){
      cargarPromosInModal(aliadoId);
      $("#fa-promo-nueva")?.addEventListener('click',()=>{
        const wrap=$("#fa-promo-form-wrap");if(!wrap)return;
        if(wrap.style.display==='block'){wrap.style.display='none';wrap.innerHTML='';}
        else{wrap.innerHTML=htmlFormPromocion({},aliadoId);wrap.style.display='block';if(window.lucide)lucide.createIcons();bindFormPromocionInline(aliadoId,'');}
      });
    }
    if(window.lucide)lucide.createIcons();
  },80);
}
async function cargarPromosInModal(aliadoId){
  const{data}=await supabase.from('promociones').select('*').eq('aliado_id',aliadoId).order('created_at',{ascending:false});
  _promos=data||[];
  const list=$("#fa-promos-list");if(!list)return;
  const TIPO_LBL={porcentaje:'% desc.','2x1':'2×1',monto_fijo:'Monto fijo',precio_especial:'Precio especial',regalo:'Regalo',personalizado:'Personalizado'};
  list.innerHTML=_promos.length?_promos.map(p=>{
    const ahorro=p.ahorro_fijo?`$${p.ahorro_fijo.toLocaleString('es-CO')} ahorro`:'Ahorro variable';
    return `<div style="display:flex;align-items:center;gap:10px;padding:10px 12px;background:#fff;border:1px solid rgba(26,26,24,.1);border-radius:8px;margin-bottom:6px">
      ${p.foto_url?`<img src="${p.foto_url}" style="width:40px;height:40px;object-fit:cover;border-radius:6px;flex-shrink:0">`:''}
      <div style="flex:1;min-width:0">
        <div style="font-size:13px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${p.descripcion}</div>
        <div style="font-size:11px;color:rgba(26,26,24,.45)">${TIPO_LBL[p.tipo]||p.tipo} · ${ahorro} · <span style="color:${p.activa?'#1a7a3c':'#888'}">${p.activa?'Activa':'Inactiva'}</span></div>
      </div>
      <button class="ad-btn ${p.en_carrusel?'ad-btn--verde':''}" data-carr-promo-in="${p.id}" data-carr="${p.en_carrusel}" style="font-size:11px;padding:4px 8px;flex-shrink:0" title="${p.en_carrusel?'Quitar del carrusel del landing':'Mostrar en el carrusel del landing (necesita foto)'}">${ic("image")}</button>
      <button class="ad-btn" data-ed-promo-in="${p.id}" style="font-size:11px;padding:4px 8px;flex-shrink:0">${ic("pencil")}</button>
      <button class="ad-btn" data-rm-promo-in="${p.id}" style="font-size:11px;padding:4px 8px;flex-shrink:0">${ic("trash-2")}</button>
    </div>`;
  }).join(''):`<p style="font-size:12px;color:rgba(26,26,24,.4);text-align:center;padding:6px 0">No hay promociones aún.</p>`;
  list.querySelectorAll('[data-carr-promo-in]').forEach(btn=>{
    btn.addEventListener('click',async()=>{
      const activar=btn.dataset.carr!=='true';
      if(activar&&!_promos.find(x=>x.id===btn.dataset.carrPromoIn)?.foto_url){toast('Esta promoción necesita una foto antes de mostrarse en el carrusel');return;}
      await supabase.from('promociones').update({en_carrusel:activar}).eq('id',btn.dataset.carrPromoIn);
      cargarPromosInModal(aliadoId);
    });
  });
  list.querySelectorAll('[data-ed-promo-in]').forEach(btn=>{
    btn.addEventListener('click',()=>{
      const p=_promos.find(x=>x.id===btn.dataset.edPromoIn);if(!p)return;
      const wrap=$("#fa-promo-form-wrap");if(!wrap)return;
      wrap.innerHTML=htmlFormPromocion(p,aliadoId);wrap.style.display='block';
      if(window.lucide)lucide.createIcons();bindFormPromocionInline(aliadoId,p.id);
      wrap.scrollIntoView({behavior:'smooth',block:'nearest'});
    });
  });
  list.querySelectorAll('[data-rm-promo-in]').forEach(btn=>{
    btn.addEventListener('click',async()=>{
      if(!confirm('¿Eliminar esta promoción?'))return;
      await supabase.from('promociones').delete().eq('id',btn.dataset.rmPromoIn);
      cargarPromosInModal(aliadoId);toast('Promoción eliminada');
    });
  });
  if(window.lucide)lucide.createIcons();
}
function bindFormPromocionInline(aliadoId,editId){
  setTimeout(()=>{
    const CALC_KEYS=['porcentaje','monto','precio','regalo','variable'];
    const showCalc=(tipo)=>{
      CALC_KEYS.forEach(k=>{const el=$(`#pr-calc-${k}`);if(el)el.style.display='none';});
      if(tipo==='porcentaje')$("#pr-calc-porcentaje").style.display='block';
      else if(tipo==='monto_fijo')$("#pr-calc-monto").style.display='block';
      else if(tipo==='precio_especial')$("#pr-calc-precio").style.display='block';
      else if(tipo==='regalo')$("#pr-calc-regalo").style.display='block';
      else if(['2x1','personalizado'].includes(tipo))$("#pr-calc-variable").style.display='block';
    };
    $("#pr-tipo")?.addEventListener('change',(e)=>showCalc(e.target.value));
    $("#pr-aplica")?.addEventListener('change',(e)=>{const w=$("#pr-prod-wrap");if(w)w.style.display=e.target.value==='producto_especifico'?'block':'none';});
    const updPrecio=()=>{const n=parseInt($("#pr-precio-n")?.value)||0;const d=parseInt($("#pr-precio-d")?.value)||0;const el=$("#pr-ahorro-prev");if(el)el.textContent=n&&d&&n>d?`Ahorro: $${(n-d).toLocaleString('es-CO')} por visita`:'';};
    $("#pr-precio-n")?.addEventListener('input',updPrecio);$("#pr-precio-d")?.addEventListener('input',updPrecio);updPrecio();
    const updPct=()=>{const n=parseInt($("#pr-precio-n-pct")?.value)||0;const pct=parseInt($("#pr-pct")?.value)||0;const el=$("#pr-ahorro-pct-prev");if(el)el.textContent=n&&pct?`Ahorro: $${Math.round(n*pct/100).toLocaleString('es-CO')} por visita`:'';};
    $("#pr-precio-n-pct")?.addEventListener('input',updPct);$("#pr-pct")?.addEventListener('input',updPct);updPct();
    document.querySelectorAll('#pr-dias-chips .fa-chip').forEach(chip=>chip.addEventListener('click',()=>chip.classList.toggle('is-on')));
    $("#pr-cancel")?.addEventListener('click',()=>{const w=$("#fa-promo-form-wrap");if(w){w.style.display='none';w.innerHTML='';}});
    const btn=$("#pr-save");
    btn?.addEventListener('click',async()=>{
      const tipo=$("#pr-tipo")?.value;const descripcion=$("#pr-desc")?.value.trim();
      if(!tipo){toast('Selecciona el tipo de promoción');return;}
      if(!descripcion){toast('La descripción es obligatoria');return;}
      btn.disabled=true;btn.innerHTML=`${ic("loader")} Guardando…`;if(window.lucide)lucide.createIcons();
      let precio_normal=null,precio_descuento=null,ahorro_fijo=null;
      if(tipo==='precio_especial'){precio_normal=parseInt($("#pr-precio-n")?.value)||null;precio_descuento=parseInt($("#pr-precio-d")?.value)||null;if(precio_normal&&precio_descuento)ahorro_fijo=precio_normal-precio_descuento;}
      else if(tipo==='porcentaje'){precio_normal=parseInt($("#pr-precio-n-pct")?.value)||null;const pct=parseInt($("#pr-pct")?.value)||0;if(precio_normal&&pct){precio_descuento=Math.round(precio_normal*(1-pct/100));ahorro_fijo=precio_normal-precio_descuento;}}
      else if(tipo==='monto_fijo'){ahorro_fijo=parseInt($("#pr-ahorro-fijo")?.value)||null;}
      else if(tipo==='regalo'){ahorro_fijo=parseInt($("#pr-regalo-val")?.value)||null;}
      const diasActivos=[...document.querySelectorAll('#pr-dias-chips .fa-chip.is-on')].map(b=>b.dataset.dia);
      let foto_url=$("#pr-foto-url")?.value||null;
      const file=$("#pr-foto")?.files?.[0];
      if(file)try{foto_url=await subirImagen(file);}catch(_){toast('Error al subir la foto');}
      const payload={aliado_id:aliadoId,tipo,descripcion,
        aplica_a:$("#pr-aplica")?.value||'toda_la_tienda',
        producto_especifico:$("#pr-aplica")?.value==='producto_especifico'?($("#pr-prod")?.value.trim()||null):null,
        precio_normal,precio_descuento,ahorro_fijo,
        dias_aplica:diasActivos.length?diasActivos:['lunes','martes','miercoles','jueves','viernes','sabado','domingo'],
        hora_inicio:$("#pr-hora-ini")?.value||null,hora_fin:$("#pr-hora-fin")?.value||null,
        fecha_inicio:$("#pr-fecha-ini")?.value||null,fecha_fin:$("#pr-fecha-fin")?.value||null,
        monto_minimo:parseInt($("#pr-min")?.value)||0,foto_url,activa:$("#pr-activa")?.checked!==false};
      const id=btn.dataset.id||editId;
      const{error}=id?await supabase.from('promociones').update(payload).eq('id',id):await supabase.from('promociones').insert(payload);
      if(error){toast('Error: '+error.message);btn.disabled=false;btn.innerHTML=`${ic("check")} ${id?'Guardar cambios':'Guardar promoción'}`;if(window.lucide)lucide.createIcons();return;}
      const w=$("#fa-promo-form-wrap");if(w){w.style.display='none';w.innerHTML='';}
      cargarPromosInModal(aliadoId);toast(id?'Promoción actualizada ✓':'Promoción guardada ✓');
    });
    if(window.lucide)lucide.createIcons();
  },80);
}

      btn.addEventListener('click',()=>{const p=_promos.find(x=>x.id===btn.dataset.edPromo);if(p){abrirModal('Editar promoción',p.descripcion,htmlFormPromocion(p,aliadoId));bindFormPromocion(aliadoId,aliadoNombre,p.id);}});
    });
    document.querySelectorAll('[data-rm-promo]').forEach(btn=>{
      btn.addEventListener('click',async()=>{if(!confirm('¿Eliminar esta promoción?'))return;await supabase.from('promociones').delete().eq('id',btn.dataset.rmPromo);cargarYMostrarPromociones(aliadoId,aliadoNombre);toast('Promoción eliminada');});
    });
    document.querySelectorAll('[data-carr-promo]').forEach(btn=>{
      btn.addEventListener('click',async()=>{
        const activar=btn.dataset.carr!=='true';
        if(activar&&!_promos.find(x=>x.id===btn.dataset.carrPromo)?.foto_url){toast('Esta promoción necesita una foto antes de mostrarse en el carrusel');return;}
        await supabase.from('promociones').update({en_carrusel:activar}).eq('id',btn.dataset.carrPromo);
        cargarYMostrarPromociones(aliadoId,aliadoNombre);
      });
    });
    if(window.lucide)lucide.createIcons();
  },80);
}

function bindFormPromocion(aliadoId,aliadoNombre,editId){
  setTimeout(()=>{
    const CALC_KEYS=['porcentaje','monto','precio','regalo','variable'];
    const showCalc=(tipo)=>{
      CALC_KEYS.forEach(k=>{const el=$(`#pr-calc-${k}`);if(el)el.style.display='none';});
      if(tipo==='porcentaje')$("#pr-calc-porcentaje").style.display='block';
      else if(tipo==='monto_fijo')$("#pr-calc-monto").style.display='block';
      else if(tipo==='precio_especial')$("#pr-calc-precio").style.display='block';
      else if(tipo==='regalo')$("#pr-calc-regalo").style.display='block';
      else if(['2x1','personalizado'].includes(tipo))$("#pr-calc-variable").style.display='block';
    };
    $("#pr-tipo")?.addEventListener('change',(e)=>showCalc(e.target.value));
    $("#pr-aplica")?.addEventListener('change',(e)=>{const w=$("#pr-prod-wrap");if(w)w.style.display=e.target.value==='producto_especifico'?'block':'none';});
    const updPrecio=()=>{const n=parseInt($("#pr-precio-n")?.value)||0;const d=parseInt($("#pr-precio-d")?.value)||0;const el=$("#pr-ahorro-prev");if(el)el.textContent=n&&d&&n>d?`Ahorro: $${(n-d).toLocaleString('es-CO')} por visita`:'';};
    $("#pr-precio-n")?.addEventListener('input',updPrecio);
    $("#pr-precio-d")?.addEventListener('input',updPrecio);
    updPrecio();
    const updPct=()=>{const n=parseInt($("#pr-precio-n-pct")?.value)||0;const pct=parseInt($("#pr-pct")?.value)||0;const el=$("#pr-ahorro-pct-prev");if(el)el.textContent=n&&pct?`Ahorro: $${Math.round(n*pct/100).toLocaleString('es-CO')} por visita`:'';};
    $("#pr-precio-n-pct")?.addEventListener('input',updPct);
    $("#pr-pct")?.addEventListener('input',updPct);
    updPct();
    document.querySelectorAll('#pr-dias-chips .fa-chip').forEach(chip=>chip.addEventListener('click',()=>chip.classList.toggle('is-on')));
    $("#pr-cancel")?.addEventListener('click',()=>{cargarYMostrarPromociones(aliadoId,aliadoNombre);});
    const btn=$("#pr-save");
    btn?.addEventListener('click',async()=>{
      const tipo=$("#pr-tipo")?.value;
      const descripcion=$("#pr-desc")?.value.trim();
      if(!tipo){toast('Selecciona el tipo de promoción');return;}
      if(!descripcion){toast('La descripción es obligatoria');return;}
      btn.disabled=true;btn.innerHTML=`${ic("loader")} Guardando…`;if(window.lucide)lucide.createIcons();
      let precio_normal=null,precio_descuento=null,ahorro_fijo=null;
      if(tipo==='precio_especial'){
        precio_normal=parseInt($("#pr-precio-n")?.value)||null;
        precio_descuento=parseInt($("#pr-precio-d")?.value)||null;
        if(precio_normal&&precio_descuento)ahorro_fijo=precio_normal-precio_descuento;
      }else if(tipo==='porcentaje'){
        precio_normal=parseInt($("#pr-precio-n-pct")?.value)||null;
        const pct=parseInt($("#pr-pct")?.value)||0;
        if(precio_normal&&pct){precio_descuento=Math.round(precio_normal*(1-pct/100));ahorro_fijo=precio_normal-precio_descuento;}
      }else if(tipo==='monto_fijo'){
        ahorro_fijo=parseInt($("#pr-ahorro-fijo")?.value)||null;
      }else if(tipo==='regalo'){
        ahorro_fijo=parseInt($("#pr-regalo-val")?.value)||null;
      }
      const diasActivos=[...document.querySelectorAll('#pr-dias-chips .fa-chip.is-on')].map(b=>b.dataset.dia);
      let foto_url=$("#pr-foto-url")?.value||null;
      const file=$("#pr-foto")?.files?.[0];
      if(file)try{foto_url=await subirImagen(file);}catch(_){toast('Error al subir la foto');}
      const payload={aliado_id:aliadoId,tipo,descripcion,
        aplica_a:$("#pr-aplica")?.value||'toda_la_tienda',
        producto_especifico:$("#pr-aplica")?.value==='producto_especifico'?($("#pr-prod")?.value.trim()||null):null,
        precio_normal,precio_descuento,ahorro_fijo,
        dias_aplica:diasActivos.length?diasActivos:['lunes','martes','miercoles','jueves','viernes','sabado','domingo'],
        hora_inicio:$("#pr-hora-ini")?.value||null,
        hora_fin:$("#pr-hora-fin")?.value||null,
        fecha_inicio:$("#pr-fecha-ini")?.value||null,
        fecha_fin:$("#pr-fecha-fin")?.value||null,
        monto_minimo:parseInt($("#pr-min")?.value)||0,
        foto_url,activa:$("#pr-activa")?.checked!==false};
      const id=btn.dataset.id||editId;
      const{error}=id?await supabase.from('promociones').update(payload).eq('id',id):await supabase.from('promociones').insert(payload);
      if(error){toast('Error: '+error.message);btn.disabled=false;btn.innerHTML=`${ic("check")} ${id?'Guardar cambios':'Guardar promoción'}`;if(window.lucide)lucide.createIcons();return;}
      cargarYMostrarPromociones(aliadoId,aliadoNombre);
      toast(id?'Promoción actualizada ✓':'Promoción creada ✓');
    });
    if(window.lucide)lucide.createIcons();
  },80);
}

  /* ---- CONTABILIDAD ---- */
  const COPc=(n)=>'$'+Number(n||0).toLocaleString('es-CO');
  function descargarCSV(nombreArchivo,headers,rows){
    const esc=v=>`"${String(v??'').replace(/"/g,'""')}"`;
    const csv=[headers.map(esc).join(','),...rows.map(r=>r.map(esc).join(','))].join('\r\n');
    const blob=new Blob(["﻿"+csv],{type:'text/csv;charset=utf-8;'});
    const url=URL.createObjectURL(blob);
    const a=document.createElement('a');
    a.href=url;a.download=nombreArchivo;document.body.appendChild(a);a.click();document.body.removeChild(a);
    URL.revokeObjectURL(url);
  }
  async function cargarContabilidad(){
    const hoy=new Date();
    if(!_contMes)_contMes=`${hoy.getFullYear()}-${String(hoy.getMonth()+1).padStart(2,'0')}`;
    const[{data:pagos},{data:gastos},{data:cats},{data:cfg},{data:pedidosCom},{data:ingMan},{data:catsIng}]=await Promise.all([
      supabase.from('pagos').select('id,monto,plan,referencia,created_at,perfiles(nombre)').order('created_at',{ascending:false}),
      supabase.from('gastos').select('id,monto,proveedor,fecha,nota,categoria_id,factura_url,categorias_gasto(nombre)').order('fecha',{ascending:false}),
      supabase.from('categorias_gasto').select('*').order('nombre'),
      supabase.from('config_contabilidad').select('*').eq('id',1).maybeSingle(),
      supabase.from('pedidos').select('id,monto,comision_valor,created_at,productos_aliado(nombre),aliados(nombre,tienda_nombre)').in('estado',['confirmado','entregado']).order('created_at',{ascending:false}),
      supabase.from('ingresos_manuales').select('id,monto,descripcion,fecha,nota,categoria_id,categorias_ingreso(nombre)').order('fecha',{ascending:false}),
      supabase.from('categorias_ingreso').select('*').order('nombre'),
    ]);
    _pagos=pagos||[];_gastos=gastos||[];_categoriasGasto=cats||[];
    _pedidosCom=pedidosCom||[];_ingresosManuales=ingMan||[];_categoriasIngreso=catsIng||[];
    if(cfg)_contConfig=cfg;
    renderContabilidadUI();
  }
  function renderContabilidadUI(){
    const[y,m]=_contMes.split('-').map(Number);
    const mesAnt=m===1?`${y-1}-12`:`${y}-${String(m-1).padStart(2,'0')}`;
    const enMes=(iso,ymStr)=>{const d=new Date(iso);const[yy,mm]=ymStr.split('-').map(Number);return d.getFullYear()===yy&&(d.getMonth()+1)===mm;};
    _contGastosMes=_gastos.filter(g=>enMes(g.fecha,_contMes));
    _contPagosMes=_pagos.filter(p=>enMes(p.created_at,_contMes));
    _contComisionMes=_pedidosCom.filter(p=>enMes(p.created_at,_contMes));
    _contIngManMes=_ingresosManuales.filter(i=>enMes(i.fecha,_contMes));
    const totalIngresos=(pagosArr,comArr,manArr)=>pagosArr.reduce((s,p)=>s+(p.monto||0),0)+comArr.reduce((s,p)=>s+(p.comision_valor||0),0)+manArr.reduce((s,i)=>s+(i.monto||0),0);
    const gastosMesAnt=_gastos.filter(g=>enMes(g.fecha,mesAnt)).reduce((s,g)=>s+(g.monto||0),0);
    const ingresosMesAnt=totalIngresos(_pagos.filter(p=>enMes(p.created_at,mesAnt)),_pedidosCom.filter(p=>enMes(p.created_at,mesAnt)),_ingresosManuales.filter(i=>enMes(i.fecha,mesAnt)));
    const ingresosMes=totalIngresos(_contPagosMes,_contComisionMes,_contIngManMes);
    const gastosMes=_contGastosMes.reduce((s,g)=>s+(g.monto||0),0);
    const balanceMes=ingresosMes-gastosMes;
    const filasIngreso=[
      ..._contPagosMes.map(p=>({tipo:'membresia',concepto:'Membresía',detalle:p.perfiles?.nombre||'—',fecha:p.created_at,monto:p.monto})),

      ..._contIngManMes.map(i=>({tipo:'manual',concepto:i.categorias_ingreso?.nombre||'Otros',detalle:i.descripcion||'—',fecha:i.fecha,monto:i.monto,id:i.id,editable:true})),

    const pctChip=(actual,anterior)=>{if(!anterior)return{chip:'—',dir:'up'};const pct=Math.round((actual-anterior)/anterior*100);return{chip:(pct>=0?'+':'')+pct+'%',dir:pct>=0?'up':'down'};};
    const chIng=pctChip(ingresosMes,ingresosMesAnt),chGas=pctChip(gastosMes,gastosMesAnt);

    // Desglose de ingresos (IVA → ICA → fundadores → gastos → renta)

    // Wompi solo cobra su comision sobre lo que realmente procesa (pagos de membresia), no sobre comisiones ni ingresos manuales

        ${metric('receipt',COPc(gastosMes),'Gastos del mes','registrados a mano',chGas.chip,chGas.dir)}
        ${metric('scale',COPc(balanceMes),'Balance del mes',balanceMes>=0?'positivo':'negativo','','up')}
        ${metric('landmark',COPc(balanceAnio),'Balance del año',`año ${y} · ingresos ${COPc(ingresosAnio)} − gastos ${COPc(gastosAnio)}`,'','up')}

      <div class="ad-toolbar"><div class="ad-card__title">Gastos</div><div class="ad-spacer"></div><button class="ad-btn" id="gastos-csv">${ic('download')} Descargar Excel</button><button class="ad-btn ad-btn--verde" id="gasto-add">${ic('plus')} Agregar gasto</button></div>

            <tr>
              <td>${g.proveedor||'—'}${g.factura_url?` <a href="${g.factura_url}" target="_blank" title="Ver factura" style="margin-left:4px;vertical-align:middle">${ic('paperclip')}</a>`:''}</td>

              <td style="text-align:right"><div style="display:flex;gap:6px;justify-content:flex-end"><button class="ad-btn" data-ed-gasto="${g.id}">${ic('pencil')}</button><button class="ad-btn" data-rm-gasto="${g.id}">${ic('trash-2')}</button></div></td>
            </tr>`).join(''):`<tr><td colspan="5" style="text-align:center;padding:30px;color:rgba(242,240,234,.3)">No hay gastos registrados este mes</td></tr>`}

  async function cargarTiendasAliados(){
    const[{data:pend},{data:tiendas}]=await Promise.all([
      supabase.from('productos_aliado').select('*,aliados(nombre,tienda_nombre)').eq('estado','pendiente').order('created_at',{ascending:true}),
      supabase.from('aliados').select('id,nombre,tienda_nombre').eq('tienda_activa',true).order('tienda_nombre'),
    ]);
    _prodalPendientes=pend||[];
    const pendBody=$('#prodal-pend-body');
    if(pendBody){
      pendBody.innerHTML=!_prodalPendientes.length
        ?`<tr><td colspan="4" style="text-align:center;padding:30px;color:rgba(242,240,234,.3)">No hay productos pendientes de aprobación</td></tr>`
        :_prodalPendientes.map(p=>`<tr>
            <td><div class="ad-cell-user">
              ${p.imagen_url?`<img src="${p.imagen_url}" style="width:40px;height:40px;object-fit:cover;border-radius:8px;flex-shrink:0">`:`<span class="ad-av">${(p.nombre||'?')[0]}</span>`}
              <div class="ad-cell-user__name">${p.nombre}</div>
            </div></td>
            <td style="font-size:12px">${p.aliados?.tienda_nombre||p.aliados?.nombre||'—'}</td>
            <td style="font-size:13px;font-weight:700">${COP(p.precio_descuento||p.precio_normal)}</td>
            <td style="text-align:right"><div style="display:flex;gap:8px;justify-content:flex-end">
              <button class="ad-btn ad-btn--verde" data-aprobar-prodal="${p.id}">${ic('check')} Aprobar</button>
              <button class="ad-btn" data-rechazar-prodal="${p.id}">${ic('x')} Rechazar</button>
            </div></td>
          </tr>`).join('');
    }
    const tiendasBody=$('#tiendas-aliados-body');
    if(tiendasBody){
      if(!tiendas?.length){
        tiendasBody.innerHTML=`<tr><td colspan="6" style="text-align:center;padding:30px;color:rgba(242,240,234,.3)">Ningún aliado ha activado su tienda todavía</td></tr>`;
      }else{
        const[{data:aprobados},{data:pedidos}]=await Promise.all([
          supabase.from('productos_aliado').select('aliado_id').eq('estado','aprobado'),
          supabase.from('pedidos').select('aliado_id,monto,comision_valor,estado'),
        ]);
        const countAprobados=(id)=>(aprobados||[]).filter(x=>x.aliado_id===id).length;
        const pedidosDe=(id)=>(pedidos||[]).filter(x=>x.aliado_id===id);
        const confirmadosDe=(id)=>pedidosDe(id).filter(x=>x.estado==='confirmado'||x.estado==='entregado');
        tiendasBody.innerHTML=tiendas.map(t=>{
          const conf=confirmadosDe(t.id);
          const ventas=conf.reduce((s,p)=>s+(p.monto||0),0);
          const comision=conf.reduce((s,p)=>s+(p.comision_valor||0),0);
          return `<tr data-ver-tienda="${t.id}" data-nom-tienda="${(t.tienda_nombre||t.nombre).replace(/"/g,'&quot;')}" style="cursor:pointer">
          <td>${t.tienda_nombre||t.nombre}</td>
          <td style="font-size:12px">${t.nombre}</td>
          <td>${countAprobados(t.id)}</td>
          <td>${pedidosDe(t.id).length}</td>
          <td>${COP(ventas)}</td>
          <td style="text-align:right"><span class="ad-num-strong">${COP(comision)}</span></td>
        </tr>`;
        }).join('');
      }
    }
    if(window.lucide)lucide.createIcons();
  }

    const activarProf=e.target.closest('[data-activar-prof]');if(activarProf){await supabase.from('profesionales').update({estado:'activo',activo:true}).eq('id',activarProf.dataset.activarProf);cargarProfesionales();toast('Profesional activado ✓');return;}
    const desactivarProf=e.target.closest('[data-desactivar-prof]');if(desactivarProf){await supabase.from('profesionales').update({estado:'pendiente',activo:false}).eq('id',desactivarProf.dataset.desactivarProf);cargarProfesionales();toast('Profesional desactivado');return;}
    const aprobarPost=e.target.closest('[data-aprobar-post]');if(aprobarPost){const id=aprobarPost.dataset.aprobarPost;const waUrl=aprobarPost.dataset.waPost;const nombre=aprobarPost.dataset.nomPost;const categoria=aprobarPost.dataset.catPost;const whatsapp=aprobarPost.dataset.telPost;await supabase.from('aliados').insert({nombre,categoria,whatsapp,activo:false});await supabase.from('aliados_postulaciones').update({estado:'aprobado'}).eq('id',id);if(waUrl)window.open(waUrl,'_blank');window.renderAliados?.();toast('Aliado aprobado — notificando por WhatsApp…');return;}
    const rechazarPost=e.target.closest('[data-rechazar-post]');if(rechazarPost&&confirm('¿Rechazar esta postulación?')){await supabase.from('aliados_postulaciones').update({estado:'rechazado'}).eq('id',rechazarPost.dataset.rechazarPost);window.renderAliados?.();toast('Postulación rechazada');return;}
    const edProf=e.target.closest('[data-ed-prof]');if(edProf){const p=_profesionales.find(x=>x.id===edProf.dataset.edProf);if(p){abrirModal('Editar profesional',p.nombre,htmlFormProf(p));bindFormProf();}return;}
    const togProf=e.target.closest('[data-tog-prof]');if(togProf){const activo=togProf.dataset.activo==='true';await supabase.from('profesionales').update({activo:!activo}).eq('id',togProf.dataset.togProf);cargarProfesionales();return;}
    const rmProf=e.target.closest('[data-rm-prof]');if(rmProf&&confirm('¿Eliminar este profesional?')){await supabase.from('profesionales').delete().eq('id',rmProf.dataset.rmProf);cargarProfesionales();toast('Profesional eliminado');return;}
    const promosAl=e.target.closest('[data-promos-aliado]');if(promosAl){cargarYMostrarPromociones(promosAl.dataset.promosAliado,promosAl.dataset.nomAliado);return;}
    const destAl=e.target.closest('[data-dest-aliado]');if(destAl){await supabase.from('aliados').update({destacado:destAl.dataset.dest!=='true'}).eq('id',destAl.dataset.destAliado);cargarAliados();return;}
    const edAl=e.target.closest('[data-ed-aliado]');if(edAl){const a=_aliados.find(x=>x.id===edAl.dataset.edAliado);if(a){abrirModal('Editar aliado',a.nombre,htmlFormAliado(a));bindFormAliado();}return;}
    const togAl=e.target.closest('[data-tog-aliado]');if(togAl){const activo=togAl.dataset.activo==='true';await supabase.from('aliados').update({activo:!activo}).eq('id',togAl.dataset.togAliado);cargarAliados();return;}
    const rmAl=e.target.closest('[data-rm-aliado]');if(rmAl&&confirm('¿Eliminar este aliado?')){await supabase.from('aliados').delete().eq('id',rmAl.dataset.rmAliado);cargarAliados();toast('Aliado eliminado');return;}
    const edPlan=e.target.closest('[data-ed-plan]');if(edPlan){const p=_planes.find(x=>x.slug===edPlan.dataset.edPlan);if(p){abrirModal('Editar plan',p.tag,htmlFormPlan(p));bindFormPlan();}return;}
    if(e.target.closest('#gasto-add')){abrirModal('Agregar gasto','Registro manual de un gasto del Club',htmlFormGasto());bindFormGasto();return;}
    const edGasto=e.target.closest('[data-ed-gasto]');if(edGasto){const g=_gastos.find(x=>x.id===edGasto.dataset.edGasto);if(g){abrirModal('Editar gasto',g.proveedor||'Gasto',htmlFormGasto(g));bindFormGasto(g);}return;}
    const rmGasto=e.target.closest('[data-rm-gasto]');if(rmGasto&&confirm('¿Eliminar este gasto?')){await supabase.from('gastos').delete().eq('id',rmGasto.dataset.rmGasto);cargarContabilidad();toast('Gasto eliminado');return;}
    if(e.target.closest('#gastos-csv')){descargarCSV(`gastos-${_contMes}.csv`,['Proveedor','Categoría','Fecha','Monto','Nota'],_contGastosMes.map(g=>[g.proveedor||'',g.categorias_gasto?.nombre||'',g.fecha,g.monto,g.nota||'']));return;}
    if(e.target.closest('#ingresos-csv')){const filas=_contFiltroIngreso&&_contFiltroIngreso!=='todos'?_contFilasIngreso.filter(f=>f.tipo===_contFiltroIngreso):_contFilasIngreso;descargarCSV(`ingresos-${_contMes}.csv`,['Concepto','Detalle','Fecha','Monto'],filas.map(f=>[f.concepto,f.detalle,f.fecha,f.monto]));return;}
    if(e.target.closest('#ingreso-add')){abrirModal('Agregar ingreso','Registro manual de un ingreso del Club',htmlFormIngreso());bindFormIngreso();return;}
    const edIngreso=e.target.closest('[data-ed-ingreso]');if(edIngreso){const i=_ingresosManuales.find(x=>x.id===edIngreso.dataset.edIngreso);if(i){abrirModal('Editar ingreso',i.descripcion||'Ingreso',htmlFormIngreso(i));bindFormIngreso(i);}return;}
    const rmIngreso=e.target.closest('[data-rm-ingreso]');if(rmIngreso&&confirm('¿Eliminar este ingreso?')){await supabase.from('ingresos_manuales').delete().eq('id',rmIngreso.dataset.rmIngreso);cargarContabilidad();toast('Ingreso eliminado');return;}
    const verTienda=e.target.closest('[data-ver-tienda]');if(verTienda&&!e.target.closest('a')){verDetalleTienda(verTienda.dataset.verTienda,verTienda.dataset.nomTienda);return;}
    const aprobarProdal=e.target.closest('[data-aprobar-prodal]');if(aprobarProdal){await supabase.from('productos_aliado').update({estado:'aprobado'}).eq('id',aprobarProdal.dataset.aprobarProdal);window.cargarTiendasAliados?.();toast('Producto aprobado ✓');return;}
    const rechazarProdal=e.target.closest('[data-rechazar-prodal]');if(rechazarProdal&&confirm('¿Rechazar este producto?')){await supabase.from('productos_aliado').update({estado:'rechazado'}).eq('id',rechazarProdal.dataset.rechazarProdal);window.cargarTiendasAliados?.();toast('Producto rechazado');return;}
  });
});
  </script>
