<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <script src="https://js.sentry-cdn.com/c008db963bd16390827cbba643292144.min.js" crossorigin="anonymous"></script>
  <script async src="https://www.googletagmanager.com/gtag/js?id=G-K062DHDKP"></script>
  <script>window.dataLayer=window.dataLayer||[];function gtag(){dataLayer.push(arguments);}gtag('js',new Date());gtag('config','G-K062DHDKP');</script>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Carta — El Club de la Gente</title>
  <link rel="manifest" href="manifest.json">
  <link rel="icon" href="icon-club.png?v=2" type="image/png">
  <link rel="apple-touch-icon" href="icon-club.png?v=2">
  <meta name="theme-color" content="#095544">
  <script>if ("serviceWorker" in navigator) window.addEventListener("load", () => navigator.serviceWorker.register("/sw.js").catch(() => {}));</script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Anton&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css?v=142">
  <link rel="stylesheet" href="carta.css?v=14">
</head>
<body>
  <div class="page-loader" id="page-loader"><img src="icon-club-isotipo.png" alt=""></div>
  <script>(function(){var l=document.getElementById('page-loader');function ocultar(){if(!l)return;l.classList.add('is-hidden');setTimeout(function(){l.remove();},400);}window.addEventListener('load',ocultar);setTimeout(ocultar,4000);})();</script>

  <div id="fondo-fijo" aria-hidden="true"></div>

  <header class="carta-top">
    <div class="wrap">
      <div class="carta-top__negocio">
        <div class="carta-top__logo" id="carta-logo"></div>
        <div style="flex:1;min-width:0">
          <div class="carta-top__nombre" id="carta-nombre">Cargando…</div>
          <div class="carta-top__sub">Carta digital · El Club de la Gente</div>
        </div>
        <a href="#" target="_blank" rel="noopener" class="carta-top__ig" id="carta-instagram" hidden aria-label="Instagram del negocio">
          <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2"><rect x="2" y="2" width="20" height="20" rx="5"/><circle cx="12" cy="12" r="4"/><circle cx="17.5" cy="6.5" r="1" fill="currentColor" stroke="none"/></svg>
        </a>
      </div>
    </div>
  </header>

  <div class="carta-aviso-wrap" id="carta-aviso-wrap" hidden>
    <div class="wrap" style="padding-top:16px">
      <div class="tienda-banner-track" id="carta-aviso-track"></div>
      <div class="tienda-banner-dots" id="carta-aviso-dots"></div>
    </div>
  </div>

  <div class="wrap"><div class="carta-cat-pills" id="carta-cat-pills"></div></div>

  <main class="wrap" id="carta-main">
    <div id="carta-estado-vacio" hidden class="carta-vacio">
      <p>Este negocio todavía no tiene su carta lista.</p>
    </div>
    <div id="carta-grid"></div>
  </main>

  <div class="carta-foto-overlay" id="carta-foto-overlay" hidden>
    <button type="button" class="carta-foto-cerrar" id="carta-foto-cerrar" aria-label="Cerrar">✕</button>
    <div class="carta-foto-escenario">
      <div class="carta-foto-piso" id="carta-foto-piso"></div>
      <div class="carta-foto-wrap" id="carta-foto-wrap">
        <div class="carta-foto-marco"></div>
        <img class="carta-foto-grande" id="carta-foto-grande" src="" alt="">
        <div class="carta-foto-glare" id="carta-foto-glare"></div>
      </div>
    </div>
  </div>

  <!-- Personalizar producto: toppings/salsas/tamaño antes de agregarlo -->
  <div class="carta-mod-overlay" id="carta-mod-overlay" hidden>
    <div class="carta-mod-sheet">
      <button type="button" class="carta-sheet__cerrar" id="carta-mod-cerrar" aria-label="Cerrar">✕</button>
      <h2 class="carta-sheet__titulo" id="carta-mod-nombre"></h2>
      <p class="carta-mod-desc" id="carta-mod-desc"></p>
      <div id="carta-mod-grupos"></div>
      <div class="carta-mod-footer">
        <div class="carta-qty en-uso" id="carta-mod-qty-wrap">
          <button type="button" class="carta-qty__menos" id="carta-mod-qty-menos" aria-label="Quitar uno">−</button>
          <span class="carta-qty__n" id="carta-mod-qty-n">1</span>
          <button type="button" id="carta-mod-qty-mas" aria-label="Agregar uno">+</button>
        </div>
        <button type="button" class="btn btn--primario" id="carta-mod-agregar">Añadir</button>
      </div>
    </div>
  </div>

  <div class="carta-barra" id="carta-barra" hidden>
    <div class="wrap carta-barra__inner">
      <div>
        <span class="carta-barra__items" id="carta-barra-items">0 productos</span>
        <span class="carta-barra__total" id="carta-barra-total">$0</span>
      </div>
      <button type="button" class="btn btn--primario" id="carta-ver-pedido">Ver pedido</button>
    </div>
  </div>

  <!-- Resumen / checkout -->
  <div class="carta-overlay" id="carta-overlay" hidden>
    <div class="carta-sheet">
      <button type="button" class="carta-sheet__cerrar" id="carta-sheet-cerrar" aria-label="Cerrar">✕</button>
      <h2 class="carta-sheet__titulo">Tu pedido</h2>
      <div id="carta-sheet-items"></div>
      <div class="carta-sheet__total"><span>Total</span><span id="carta-sheet-total">$0</span></div>

      <div id="carta-sheet-form">
        <div class="carta-campo"><label>Tu nombre *</label><input id="carta-cliente-nombre" type="text" placeholder="¿Cómo te llamas?"></div>
        <div class="carta-campo">
          <label>WhatsApp (opcional)</label>
          <input id="carta-cliente-wa" type="tel" placeholder="300 000 0000">
          <p id="carta-sellos-hint" hidden style="font-size:12px;color:var(--verde);margin-top:6px;line-height:1.5"></p>
        </div>
        <div class="carta-campo"><label>Nota <span style="font-weight:400;color:var(--tinta-45)">(mesa, domicilio, etc.)</span></label><input id="carta-cliente-nota" type="text" placeholder="Ej: Mesa 4"></div>

        <div class="carta-campo">
          <label>¿Cómo vas a pagar? *</label>
          <div class="carta-metodo-pago">
            <button type="button" class="carta-metodo-btn" data-metodo="efectivo">💵 Efectivo</button>
            <button type="button" class="carta-metodo-btn" data-metodo="transferencia">🏦 Transferencia</button>
          </div>
        </div>

        <div id="carta-pago-efectivo" hidden class="carta-pago-detalle">
          <p>Ve a la caja para efectuar el pago. Cuando ya hayas pagado, dale a "Ya pagué".</p>
        </div>

        <div id="carta-pago-transferencia" hidden class="carta-pago-detalle">
          <div class="carta-campo">
            <label>Llave de pago (Nequi, Bre-B...)</label>
            <div style="display:flex;gap:8px">
              <input id="carta-pago-llave" readonly style="flex:1;min-width:0">
              <button type="button" class="btn" id="carta-pago-llave-copiar" style="white-space:nowrap">Copiar</button>
            </div>
          </div>
          <div class="carta-campo">
            <label>Comprobante de pago *</label>
            <input type="file" id="carta-comprobante" accept="image/*">
          </div>
        </div>

        <button type="button" class="btn btn--primario carta-sheet__enviar" id="carta-enviar-pedido">Ya pagué</button>
      </div>

      <div id="carta-sheet-exito" hidden class="carta-exito">
        <div class="carta-exito__check">✓</div>
        <h3>¡Pedido enviado!</h3>
        <p>El negocio lo confirmará pronto. Gracias por tu compra.</p>
        <p id="carta-sellos-resultado" hidden style="margin-top:14px;font-size:13.5px;font-weight:600;color:var(--verde);background:var(--verde-soft);border-radius:10px;padding:12px"></p>
      </div>
    </div>
  </div>

  <script type="module" src="carta.js?v=15"></script>

  <template id="__bundler_thumbnail">
    <svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
      <rect width="100" height="100" fill="#F1F7F6"/>
      <rect x="30" y="30" width="40" height="40" rx="4" fill="none" stroke="#021B1A" stroke-width="3"/>
      <rect x="38" y="38" width="10" height="10" fill="#095544"/>
      <rect x="52" y="38" width="10" height="10" fill="#021B1A"/>
      <rect x="38" y="52" width="10" height="10" fill="#021B1A"/>
      <rect x="52" y="52" width="10" height="10" fill="#095544"/>
    </svg>
  </template>

</body>
</html>
